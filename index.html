          state.explore.minRating = e.target.value;
          loadAndRenderExplore(true);

      el.detailContent.addEventListener('click', e => {
        const entry = state.modal.stack[state.modal.stack.length - 1];
        if (!entry) return;

        if (e.target.closest('#modalStackBackBtn')) {
          popModalStack();
          return;
        }
        if (e.target.closest('#manualLoadStreamBtn')) {
          entry.streamLoaded = true;
          if (state.modal.currentMovieData?.movie) {
            recordHistory(state.modal.currentMovieData.movie, entry.serverId);
          }
          renderMovieModalHtml(entry, state.modal.currentMovieData);
          return;
        }
        const modeBtn = e.target.closest('[data-player-mode]');
        if (modeBtn) {
          entry.mode = modeBtn.dataset.playerMode;
          renderMovieModalHtml(entry, state.modal.currentMovieData);
          return;
        }
        const srvBtn = e.target.closest('[data-switch-server]');
        if (srvBtn) {
          entry.serverId = srvBtn.dataset.switchServer;
          entry.mode = 'stream';
          entry.streamLoaded = true;
          if (state.modal.currentMovieData?.movie) {
            recordHistory(state.modal.currentMovieData.movie, entry.serverId);
          }
          renderMovieModalHtml(entry, state.modal.currentMovieData);
          const srvObj = SERVERS.find(s => s.id === entry.serverId);
          if (srvObj) showToast(`Switched to ${srvObj.name}`);
          return;
        }
        const trlBtn = e.target.closest('[data-switch-trailer]');
        if (trlBtn) {
          entry.trailerKey = trlBtn.dataset.switchTrailer;
          entry.mode = 'trailer';
          renderMovieModalHtml(entry, state.modal.currentMovieData);
          return;
        }
        if (e.target.closest('#reloadPlayerBtn')) {
          if (entry.mode === 'stream') entry.streamLoaded = true;
          renderMovieModalHtml(entry, state.modal.currentMovieData);
          showToast('Player reloaded');
          return;
        }
        if (e.target.closest('#fullscreenPlayerBtn') || e.target.closest('#exitFsFloatingBtn')) {
          togglePlayerFullscreen();
          return;
        }
        const genreBtn = e.target.closest('[data-explore-genre]');
        if (genreBtn) {
          const gid = genreBtn.dataset.exploreGenre;
          closeDetailModal();
          state.explore.genreId = gid;
          state.explore.presetTitle = `${state.genreMap.get(Number(gid)) || 'Genre'} Movies`;
          switchView('explore');
          return;
        }
        const personBtn = e.target.closest('[data-open-person]');
        if (personBtn) {
          openPersonModal(personBtn.dataset.openPerson);
          return;
        }
        const stillBtn = e.target.closest('[data-open-still]');
        if (stillBtn) {
          el.lightboxImg.src = stillBtn.dataset.openStill;
          el.lightboxOverlay.classList.add('open');
          return;
        }
        if (e.target.closest('#togglePersonBioBtn')) {
          entry.bioExpanded = !entry.bioExpanded;
          renderPersonModalHtml(entry, state.modal.currentPersonData);
        }
      });

      el.detailContent.addEventListener('change', e => {
        const entry = state.modal.stack[state.modal.stack.length - 1];
        if (!entry || entry.type !== 'person') return;
        if (e.target.id === 'personSortSelect') {
          entry.sort = e.target.value;
          renderPersonModalHtml(entry, state.modal.currentPersonData);
        } else if (e.target.id === 'personRoleSelect') {
          entry.roleFilter = e.target.value;
          renderPersonModalHtml(entry, state.modal.currentPersonData);
        }
      });

      el.settingsContent.addEventListener('click', e => {
        const sw = e.target.closest('[data-setting-toggle]');
        if (sw) {
          const key = sw.dataset.settingToggle;
          const next = !state.settings[key];
          sw.setAttribute('aria-checked', String(next));
          updateSetting(key, next);
          return;
        }
        if (e.target.closest('#clearHistoryBtn')) {
          state.history = [];
          saveJson(STORAGE_KEYS.HISTORY, []);
          syncNavBadges();
          renderSettingsModal();
          if (state.view === 'history') renderHistoryView();
          if (state.view === 'home') renderHomeView();
          showToast('Watch History cleared');
          return;
        }
        if (e.target.closest('#clearRecentBtn')) {
          state.recentSearches = [];
          saveJson(STORAGE_KEYS.RECENT, []);
          renderRecentSearches();
          renderSettingsModal();
          showToast('Recent searches cleared');
          return;
        }
        if (e.target.closest('#clearSavedBtn')) {
          state.watchlist = [];
          saveJson(STORAGE_KEYS.WATCHLIST, []);
          syncNavBadges();
          renderSettingsModal();
          if (state.view === 'saved') renderSavedView();
          showToast('Saved Watchlist cleared');
          return;
        }
        if (e.target.closest('#exportJsonBtn')) {
          exportBackupJson();
          return;
        }
        if (e.target.closest('#resetSettingsBtn')) {
          state.settings = { ...DEFAULT_SETTINGS };
          saveJson(STORAGE_KEYS.SETTINGS, state.settings);
          applySettingsToDOM();
          renderSettingsModal();
          showToast('Settings reset to defaults', 'success');
        }
      });

      el.settingsContent.addEventListener('change', e => {
        if (e.target.id === 'settingDefaultServer') {
          updateSetting('defaultServer', e.target.value);
          showToast('Default server updated');
        } else if (e.target.id === 'settingLayoutMode') {
          updateSetting('layoutMode', e.target.value);
          showToast(`Layout set to ${e.target.value === 'single' ? 'Single-Card View' : 'Standard Grid'}`);
        } else if (e.target.id === 'importJsonInput') {
          importBackupJson(e.target.files?.[0]);
          e.target.value = '';
        }
      });

      document.getElementById('brandHomeBtn').addEventListener('click', () => switchView('home'));
      document.getElementById('quickSavedBtn').addEventListener('click', () => switchView('saved'));
      document.getElementById('quickHistoryBtn').addEventListener('click', () => switchView('history'));
      document.getElementById('openSettingsBtn').addEventListener('click', openSettingsModal);

      el.settingsClose.addEventListener('click', closeSettingsModal);
      el.lightboxClose.addEventListener('click', () => {
        el.lightboxOverlay.classList.remove('open');
        el.lightboxImg.src = '';
      });

        if (e.target === el.lightboxOverlay) {
          el.lightboxOverlay.classList.remove('open');
          el.lightboxImg.src = '';
        }
      });

      });
      el.settingsBackdrop.addEventListener('click', e => {
        if (e.target === el.settingsBackdrop) closeSettingsModal();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          if (el.lightboxOverlay.classList.contains('open')) {
            el.lightboxOverlay.classList.remove('open');
            el.lightboxImg.src = '';
          } else if (el.settingsBackdrop.classList.contains('open')) {
            closeSettingsModal();
          } else if (state.modal.open) {
            closeDetailModal();
          }
        }
      });

      window.addEventListener('online', () => {
        el.networkBanner.classList.remove('visible');
        showToast('Connection restored', 'success');
      });
      window.addEventListener('offline', () => {
        el.networkBanner.classList.add('visible');
      });
      el.networkRetryBtn.addEventListener('click', () => switchView(state.view));

      window.__handleNativeBack = function () {
        if (el.lightboxOverlay.classList.contains('open')) {
          el.lightboxOverlay.classList.remove('open');
          el.lightboxImg.src = '';
          return true;
        }
        const stage = document.getElementById('playerAspectStage');
        if (stage && (document.fullscreenElement === stage || stage.classList.contains('pseudo-fullscreen'))) {
          togglePlayerFullscreen();
          return true;
        }
        if (el.settingsBackdrop.classList.contains('open')) {
          closeSettingsModal();
          return true;
        }
        if (state.modal.open) {
          popModalStack();
          return true;
        }
        if (state.view !== 'home') {
          switchView('home');
          return true;
        }
        return false;
      };

      applySettingsToDOM();
      syncNavBadges();
      renderRecentSearches();
      if (!navigator.onLine) el.networkBanner.classList.add('visible');
      loadAndRenderHome();
    })();
  </script>
</body>
</html>
