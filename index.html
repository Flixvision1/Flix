<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06070b" />
  <title>CineVault Pro — CinemaOS</title>
  <style>
    :root {
      --bg-void: #05060a;
      --bg-surface: #0b0d14;
      --bg-elevated: #121521;
      --bg-card: #10131d;
      --bg-hover: #171b29;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f5f7fc;
      --text-secondary: #a2abc0;
      --text-muted: #6c758d;
      --accent: #e50914;
      --accent-hover: #ff1f2c;
      --accent-soft: rgba(229, 9, 20, 0.16);
      --gold: #f5b942;
      --gold-soft: rgba(245, 185, 66, 0.16);
      --emerald: #22c55e;
      --emerald-soft: rgba(34, 197, 94, 0.16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --header-h: 64px;
      --bottom-nav-h: 64px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-card: 0 12px 30px rgba(0, 0, 0, 0.45);
      --shadow-modal: 0 28px 80px rgba(0, 0, 0, 0.78);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color-scheme: dark;
    }

    html.no-smooth-scroll {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(229, 9, 20, 0.12), transparent 60%),
        radial-gradient(ellipse 70% 45% at 88% 5%, rgba(59, 130, 246, 0.08), transparent 55%);
      background-repeat: no-repeat;
      color: var(--text-primary);
      overflow-x: hidden;
      padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
    }

    @media (min-width: 900px) {
      body {
        padding-bottom: 40px;
      }
    }

    body.modal-open {
      overflow: hidden;
    }

    body.reduced-motion *,
    body.reduced-motion *::before,
    body.reduced-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

    :focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 2px;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(6, 7, 11, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      min-height: var(--header-h);
      padding: 10px max(16px, env(safe-area-inset-left, 16px));
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 44px;
      padding: 4px 6px 4px 2px;
      border-radius: var(--radius-md);
      transition: opacity 0.2s var(--ease-out);
    }
    .brand-btn:hover { opacity: 0.9; }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e50914 0%, #991b1b 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.08;
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.02rem;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-sub {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-hairline);
      padding: 4px;
      border-radius: 999px;
    }

    @media (min-width: 900px) {
      .desktop-nav { display: flex; }
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
      white-space: nowrap;
    }
    .nav-pill:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
    }
    .nav-pill.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(229, 9, 20, 0.32);
    }

    .nav-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .nav-pill.active .nav-count {
      background: rgba(0, 0, 0, 0.3);
    }

    .search-wrap {
      flex: 1;
      min-width: 190px;
      max-width: 480px;
      position: relative;
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 38px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s var(--ease-out), background-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      outline: none;
      border-color: rgba(229, 9, 20, 0.7);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.18);
    }

    .search-clear {
      position: absolute;
      right: 6px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 0.15s, color 0.15s;
    }
    .search-clear.visible { display: flex; }
    .search-clear:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-strong);
      color: #fff;
    }
    .icon-btn .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-void);
    }
    .icon-btn .badge-dot:empty { display: none; }

    .recent-bar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 16px 10px;
      display: none;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .recent-bar::-webkit-scrollbar { display: none; }
    .recent-bar.visible { display: flex; }

    .recent-label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .recent-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 8px 0 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-hairline);
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .recent-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-strong);
      color: #fff;
    }
    .recent-chip-text {
      padding: 2px 0;
    }
    .recent-chip-del {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .recent-chip-del:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .network-banner {
      display: none;
      background: rgba(229, 9, 20, 0.16);
      border-bottom: 1px solid rgba(229, 9, 20, 0.4);
      color: #fecaca;
      padding: 8px 16px;
      font-size: 0.85rem;
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .network-banner.visible { display: flex; }

    .main-viewport {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }
    @media (min-width: 768px) {
      .main-viewport { padding: 24px 28px 36px; }
    }

    .hero-section {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      min-height: 360px;
      display: flex;
      align-items: flex-end;
      margin-bottom: 28px;
      box-shadow: var(--shadow-card);
    }
    @media (min-width: 768px) {
      .hero-section { min-height: 460px; }
    }

    .hero-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      transition: opacity 0.45s var(--ease-out);
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(5, 6, 10, 0.96) 0%, rgba(5, 6, 10, 0.78) 48%, rgba(5, 6, 10, 0.25) 100%),
        linear-gradient(0deg, rgba(5, 6, 10, 0.98) 0%, rgba(5, 6, 10, 0.4) 55%, rgba(5, 6, 10, 0.15) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 24px 20px;
      max-width: 720px;
      width: 100%;
    }
    @media (min-width: 768px) {
      .hero-content { padding: 38px 40px; }
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #ff8a90;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .hero-title {
      margin: 0 0 10px;
      font-size: clamp(1.65rem, 3.6vw, 3rem);
      font-weight: 850;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: #fff;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .rating-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--gold-soft);
      border: 1px solid rgba(245, 185, 66, 0.35);
      color: var(--gold);
      font-weight: 700;
      font-size: 0.82rem;
    }

    .hero-overview {
      margin: 0 0 20px;
      color: #cbd3e3;
      font-size: 0.95rem;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.35);
      transition: background-color 0.2s var(--ease-out), transform 0.2s var(--ease-out);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-strong);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-secondary.saved {
      background: var(--emerald-soft);
      border-color: rgba(34, 197, 94, 0.45);
      color: #86efac;
    }

    .hero-dots {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 3;
      display: flex;
      gap: 6px;
    }
    .hero-dot {
      width: 24px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      transition: width 0.25s var(--ease-out), background-color 0.25s;
    }
    .hero-dot.active {
      width: 38px;
      background: var(--accent);
    }

    .rail-section {
      margin-bottom: 30px;
      content-visibility: auto;
      contain-intrinsic-size: 340px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .section-accent {
      width: 4px;
      height: 20px;
      border-radius: 999px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .section-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
      transition: background-color 0.18s, color 0.18s, border-color 0.18s;
    }
    .link-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-strong);
      color: #fff;
    }

    .rail-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(154px, 178px);
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x proximity;
    }
    @media (min-width: 768px) {
      .rail-track {
        grid-auto-columns: minmax(180px, 206px);
        gap: 16px;
      }
    }

    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-controls-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .control-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .select-input {
      height: 40px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      font-size: 0.88rem;
      transition: border-color 0.18s;
    }
    .select-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .genre-chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .genre-chips-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 0.18s, color 0.18s, border-color 0.18s;
    }
    .filter-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 16px;
    }
    @media (min-width: 768px) {
      .movies-grid {
        grid-template-columns: repeat(auto-fill, minmax(192px, 1fr));
        gap: 20px;
      }
    }

    body.single-card-mode .movies-grid {
      grid-template-columns: 1fr;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
      gap: 18px;
    }

    body.single-card-mode .movies-grid .movie-card {
      flex-direction: row;
      min-height: 210px;
    }

    body.single-card-mode .movies-grid .card-poster-wrap {
      width: 145px;
      flex-shrink: 0;
      aspect-ratio: auto;
    }
    @media (min-width: 640px) {
      body.single-card-mode .movies-grid .card-poster-wrap {
        width: 170px;
      }
    }

    body.single-card-mode .movies-grid .card-body {
      padding: 16px 18px;
      justify-content: center;
    }

    body.single-card-mode .movies-grid .card-overview {
      -webkit-line-clamp: 4;
    }

    .movie-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      scroll-snap-align: start;
      content-visibility: auto;
      contain-intrinsic-size: 320px;
      transition: transform 0.25s var(--ease-out), border-color 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
    }

    .movie-card:hover {
      will-change: transform;
      transform: translateY(-4px);
      border-color: var(--border-strong);

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .setting-row:last-child { border-bottom: none; }

    .setting-title {
      font-weight: 700;
      font-size: 0.94rem;
      color: #fff;
    }
    .setting-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .switch-btn {
      position: relative;
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      flex-shrink: 0;
      transition: background-color 0.2s var(--ease-out);
    }
    .switch-btn[aria-checked="true"] {
      background: var(--accent);
    }
    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s var(--ease-spring);
    }
    .switch-btn[aria-checked="true"] .switch-knob {
      transform: translateX(20px);
    }

    .data-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      padding: 14px 16px;
    }

    .btn-danger-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      background: rgba(229, 9, 20, 0.08);
      border: 1px solid rgba(229, 9, 20, 0.35);
      color: #fca5a5;
      font-size: 0.84rem;
      font-weight: 700;
      transition: background-color 0.15s;
    }
    .btn-danger-outline:hover {
      background: rgba(229, 9, 20, 0.2);
      color: #fff;
    }

    .toast-stack {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px) + 14px);
      right: 16px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    @media (min-width: 900px) {
      .toast-stack { bottom: 22px; right: 24px; }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-item {
      pointer-events: auto;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: rgba(16, 19, 29, 0.96);
      border: 1px solid var(--border-strong);
      color: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      animation: toastIn 0.22s var(--ease-out);
      max-width: 340px;
    }
    .toast-item.success { border-color: rgba(34, 197, 94, 0.55); }
    .toast-item.error { border-color: rgba(229, 9, 20, 0.7); }

    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0, 0, 0, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img {
      max-width: 96vw;
      max-height: 88vh;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
    }
  </style>
</head>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const TMDB_KEY = 'cd193c4897ae4e519cca3734ef116a7e';
      const TMDB_BASE = 'https://api.themoviedb.org/3';
      const IMG_BASE = 'https://image.tmdb.org/t/p';

      const STORAGE_KEYS = {
        WATCHLIST: 'cinevault_watchlist_v1',
        HISTORY: 'cinevault_history_v1',
        RECENT: 'cinevault_recent_searches_v1',
        SETTINGS: 'cinevault_settings_v1'
      };

      const SERVERS = [
        { id: 'vidlink', name: 'VidLink Pro', tag: '4K HDR', buildUrl: id => `https://vidlink.pro/movie/${id}?primaryColor=e50914&autoplay=true` },
        { id: 'superembed', name: 'SuperEmbed 4K', tag: 'Multi-Audio', buildUrl: id => `https://multiembed.mov/?video_id=${id}&tmdb=1` },
        { id: 'flixvision', name: 'FlixVision HD', tag: 'Subtitles', buildUrl: id => `https://vidsrc.cc/v2/embed/movie/${id}` },
        { id: 'vidsrcto', name: 'VidSrc.to', tag: 'Reliable', buildUrl: id => `https://vidsrc.to/embed/movie/${id}` },
        { id: '2embed', name: '2Embed Stream', tag: 'Mirror HD', buildUrl: id => `https://www.2embed.cc/embed/${id}` },
        { id: 'smashy', name: 'SmashyStream HD', tag: 'Adaptive', buildUrl: id => `https://player.smashy.stream/movie/${id}` },
        { id: 'atlantic', name: 'Atlantic Stream', tag: 'Backup', buildUrl: id => `https://moviesapi.club/movie/${id}` }
      ];

      const DEFAULT_SETTINGS = {
        autoPlayStream: true,
        defaultServer: 'vidlink',
        layoutMode: 'grid',
        showCardMeta: true,
        showRecommendations: true,
        reducedMotion: false
      };

      const YEAR_FILTERS = [
        { value: '', label: 'All Years' },
        { value: '2026', label: '2026' },
        { value: '2025', label: '2025' },
        { value: '2024', label: '2024' },
        { value: '2020s', label: '2020s (2020–2029)' },
        { value: '2010s', label: '2010s (2010–2019)' },
        { value: '2000s', label: '2000s (2000–2009)' },
        { value: '1990s', label: '1990s (1990–1999)' },
        { value: '1980s', label: '1980s (1980–1989)' },
        { value: 'classic', label: 'Classics (Pre-1980)' }
      ];

      const apiCache = new Map();
      const state = {
        view: 'home',
        genres: [],
        genreMap: new Map(),
        explore: {
          genreId: '',
          sort: 'popularity.desc',
          yearFilter: '',
          minRating: '',
          page: 1,
          totalPages: 1,
          totalResults: 0,
          items: [],
          presetTitle: 'Explore Movies'
        },
        search: {
          query: '',
          page: 1,
          totalPages: 1,
          totalResults: 0,
          items: []
        },
        home: {
          spotlights: [],
          spotlightIdx: 0,
          trending: [],
          nowPlaying: [],
          topRated: [],
          recommended: [],
          recommendedLabel: 'Popular Picks'
        },
        watchlist: loadJson(STORAGE_KEYS.WATCHLIST, []),
        history: loadJson(STORAGE_KEYS.HISTORY, []),
        recentSearches: loadJson(STORAGE_KEYS.RECENT, []),
        settings: { ...DEFAULT_SETTINGS, ...loadJson(STORAGE_KEYS.SETTINGS, {}) },
        modal: {
          open: false,
          stack: [],
          currentMovieData: null,
          currentPersonData: null
        },
        controllers: {
          view: null,
          modal: null
        }
      };

      const el = {
        main: document.getElementById('mainViewport'),
        searchInput: document.getElementById('searchInput'),
        searchClear: document.getElementById('searchClearBtn'),
        recentBar: document.getElementById('recentSearchesBar'),
        networkBanner: document.getElementById('networkBanner'),
        networkBannerText: document.getElementById('networkBannerText'),
        networkRetryBtn: document.getElementById('networkRetryBtn'),
        detailBackdrop: document.getElementById('detailModalBackdrop'),
        detailDialog: document.getElementById('detailModalDialog'),
        detailContent: document.getElementById('detailModalContent'),
        detailClose: document.getElementById('detailModalCloseBtn'),
        settingsBackdrop: document.getElementById('settingsModalBackdrop'),
        settingsContent: document.getElementById('settingsModalContent'),
        settingsClose: document.getElementById('settingsModalCloseBtn'),
        lightboxOverlay: document.getElementById('lightboxOverlay'),
        lightboxImg: document.getElementById('lightboxImg'),
        lightboxClose: document.getElementById('lightboxCloseBtn'),
        toastStack: document.getElementById('toastStack'),
        navSavedCount: document.getElementById('navSavedCount'),
        navHistoryCount: document.getElementById('navHistoryCount'),
        headerSavedBadge: document.getElementById('headerSavedBadge'),
        headerHistoryBadge: document.getElementById('headerHistoryBadge'),
        mobileSavedBadge: document.getElementById('mobileSavedBadge'),
        mobileHistoryBadge: document.getElementById('mobileHistoryBadge')
      };

      function loadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed ?? fallback;
        } catch {
          return fallback;
        }
      }

      function saveJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          showToast('Storage quota exceeded. Clear history to free space.', 'error');
        }
      }

      function esc(str) {
        if (str == null) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function imgUrl(path, size = 'w342') {
        return path ? `${IMG_BASE}/${size}${path}` : '';
      }

      function formatRuntime(mins) {
        if (!mins || mins <= 0) return 'N/A';
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
      }

      function formatMoney(amount) {
        if (!amount || amount <= 0) return '—';
        if (amount >= 1e9) return `$${(amount / 1e9).toFixed(2)}B`;
        if (amount >= 1e6) return `$${(amount / 1e6).toFixed(1)}M`;
        return `$${amount.toLocaleString()}`;
      }

      function formatYear(dateStr) {
        return dateStr && dateStr.length >= 4 ? dateStr.slice(0, 4) : 'TBA';
      }

      function formatRating(vote) {
        return typeof vote === 'number' && vote > 0 ? vote.toFixed(1) : 'NR';
      }

      function getInitials(name) {
        if (!name) return '?';
        const parts = name.trim().split(/\s+/);
        return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
      }

      function showToast(msg, type = 'info') {
        const node = document.createElement('div');
        node.className = `toast-item ${type}`;
        node.textContent = msg;
        el.toastStack.appendChild(node);
        setTimeout(() => {
          node.style.opacity = '0';
          node.style.transition = 'opacity 0.2s';
          setTimeout(() => node.remove(), 220);
        }, 2800);
      }

      function applySettingsToDOM() {
        const s = state.settings;
        document.body.classList.toggle('single-card-mode', s.layoutMode === 'single');
        document.body.classList.toggle('hide-card-meta', !s.showCardMeta);
        document.body.classList.toggle('reduced-motion', !!s.reducedMotion);
        document.documentElement.classList.toggle('no-smooth-scroll', !!s.reducedMotion);
      }

      function syncNavBadges() {
        const savedLen = state.watchlist.length;
        const histLen = state.history.length;
        el.navSavedCount.textContent = savedLen;
        el.navHistoryCount.textContent = histLen;
        el.headerSavedBadge.textContent = savedLen > 0 ? (savedLen > 99 ? '99+' : savedLen) : '';
        el.headerHistoryBadge.textContent = histLen > 0 ? (histLen > 99 ? '99+' : histLen) : '';
        el.mobileSavedBadge.textContent = savedLen > 0 ? (savedLen > 99 ? '99+' : savedLen) : '';
        el.mobileHistoryBadge.textContent = histLen > 0 ? (histLen > 99 ? '99+' : histLen) : '';

        document.querySelectorAll('[data-view]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === state.view);
        });
      }

      async function tmdbFetch(endpoint, params = {}, signal) {
        const url = new URL(`${TMDB_BASE}${endpoint}`);
        url.searchParams.set('api_key', TMDB_KEY);
        url.searchParams.set('language', 'en-US');
        Object.entries(params).forEach(([k, v]) => {
          if (v !== undefined && v !== null && v !== '') {
            url.searchParams.set(k, String(v));
          }
        });
        const cacheKey = url.toString();
        if (apiCache.has(cacheKey)) {
          return apiCache.get(cacheKey);
        }
        const res = await fetch(cacheKey, { signal });
        if (!res.ok) {
          throw new Error(`TMDB Error ${res.status}`);
        }
        const data = await res.json();
        apiCache.set(cacheKey, data);
        return data;
      }

      function abortController(slot) {
        if (state.controllers[slot]) {
          state.controllers[slot].abort();
        }
        state.controllers[slot] = new AbortController();
        return state.controllers[slot].signal;
      }

      function isSaved(movieId) {
        return state.watchlist.some(m => m.id === Number(movieId));
      }

      function toggleWatchlist(movie) {
        const id = Number(movie.id);
        const idx = state.watchlist.findIndex(m => m.id === id);
        let added = false;
        if (idx >= 0) {
          state.watchlist.splice(idx, 1);
          showToast(`Removed "${movie.title}" from Saved`);
        } else {
          state.watchlist.unshift({
            id,
            title: movie.title || 'Untitled',
            poster_path: movie.poster_path || null,
            backdrop_path: movie.backdrop_path || null,
            release_date: movie.release_date || '',
            vote_average: movie.vote_average || 0,
            overview: movie.overview || '',
            genre_ids: movie.genre_ids || (movie.genres ? movie.genres.map(g => g.id) : []),
            savedAt: Date.now()
          });
          added = true;
          showToast(`Saved "${movie.title}" to Watchlist`, 'success');
        }
        saveJson(STORAGE_KEYS.WATCHLIST, state.watchlist);
        syncNavBadges();
        refreshAllSaveButtonsForId(id, added);
        if (state.view === 'saved') renderSavedView();
        return added;
      }

      function refreshAllSaveButtonsForId(movieId, saved) {
        document.querySelectorAll(`[data-save-id="${movieId}"]`).forEach(btn => {
          btn.classList.toggle('saved', saved);
          btn.setAttribute('aria-pressed', String(saved));
          if (btn.dataset.saveStyle === 'hero' || btn.dataset.saveStyle === 'detail') {
            btn.innerHTML = saved
              ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Saved in Watchlist`
              : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Save to Watchlist`;
          } else {
            btn.innerHTML = saved
              ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`
              : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
          }
        });
      }

      function recordHistory(movie, serverId) {
        const id = Number(movie.id);
        const srv = SERVERS.find(s => s.id === serverId) || SERVERS[0];
        const existingIdx = state.history.findIndex(h => h.id === id);
        const entry = {
          id,
          title: movie.title || 'Untitled',
          poster_path: movie.poster_path || null,
          backdrop_path: movie.backdrop_path || null,
          release_date: movie.release_date || '',
          vote_average: movie.vote_average || 0,
          overview: movie.overview || '',
          genre_ids: movie.genre_ids || (movie.genres ? movie.genres.map(g => g.id) : []),
          serverId: srv.id,
          serverName: srv.name,
          watchedAt: Date.now()
        };
        if (existingIdx >= 0) state.history.splice(existingIdx, 1);
        state.history.unshift(entry);
        if (state.history.length > 60) state.history.length = 60;
        saveJson(STORAGE_KEYS.HISTORY, state.history);
        syncNavBadges();
      }

      function removeHistoryItem(movieId) {
        state.history = state.history.filter(h => h.id !== Number(movieId));
        saveJson(STORAGE_KEYS.HISTORY, state.history);
        syncNavBadges();
        if (state.view === 'history') renderHistoryView();
        if (state.view === 'home') renderHomeView(false);
        showToast('Removed from Watch History');
      }

      function addRecentSearch(query) {
        const clean = query.trim();
        if (!clean || clean.length < 2) return;
        state.recentSearches = [clean, ...state.recentSearches.filter(q => q.toLowerCase() !== clean.toLowerCase())].slice(0, 10);
        saveJson(STORAGE_KEYS.RECENT, state.recentSearches);
        renderRecentSearches();
      }

      function removeRecentSearch(query) {
        state.recentSearches = state.recentSearches.filter(q => q !== query);
        saveJson(STORAGE_KEYS.RECENT, state.recentSearches);
        renderRecentSearches();
      }

      function renderRecentSearches() {
        if (!state.recentSearches.length) {
          el.recentBar.classList.remove('visible');
          el.recentBar.innerHTML = '';
          return;
        }
        el.recentBar.classList.add('visible');
        el.recentBar.innerHTML = `
          <span class="recent-label">Recent:</span>
          ${state.recentSearches.map(q => `
            <span class="recent-chip">
              <button class="recent-chip-text" data-recent-query="${esc(q)}">${esc(q)}</button>
              <button class="recent-chip-del" data-remove-recent="${esc(q)}" aria-label="Remove ${esc(q)}">×</button>
            </span>
          `).join('')}
        `;
      }

      function renderMovieCard(movie, options = {}) {
        const saved = isSaved(movie.id);
        const year = formatYear(movie.release_date);
        const rating = formatRating(movie.vote_average);
        const poster = imgUrl(movie.poster_path, 'w342');
        const payload = esc(JSON.stringify({
          id: movie.id,
          title: movie.title || 'Untitled',
          poster_path: movie.poster_path || null,
          backdrop_path: movie.backdrop_path || null,
          release_date: movie.release_date || '',
          vote_average: movie.vote_average || 0,
          overview: movie.overview || '',
          genre_ids: movie.genre_ids || []
        }));

        return `
          <article class="movie-card" data-movie-card="${movie.id}">
            <div class="card-poster-wrap" data-open-movie="${movie.id}">
              ${poster
                ? `<img class="card-poster" src="${poster}" alt="${esc(movie.title)} poster" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="poster-fallback" style="display:none"><span>${esc(movie.title)}</span></div>`
                : `<div class="poster-fallback"><span>${esc(movie.title)}</span></div>`
              }
              <span class="card-badge-rating tabular" aria-label="Rating ${rating}">★ ${rating}</span>
              <button
                class="card-quick-save ${saved ? 'saved' : ''}"
                data-save-id="${movie.id}"
                data-movie-payload="${payload}"
                aria-label="${saved ? 'Remove from saved' : 'Save to watchlist'}"
                aria-pressed="${saved}"
                title="${saved ? 'Saved' : 'Save to Watchlist'}"
              >
                ${saved
                  ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`
                  : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`
                }
              </button>
              ${options.showHistoryControls && movie.serverName ? `<span class="card-server-pill">${esc(movie.serverName)}</span>` : ''}
              ${options.showHistoryControls ? `<button class="card-remove-history" data-remove-history="${movie.id}" aria-label="Remove from history" title="Remove from history">×</button>` : ''}
            </div>
            <div class="card-body" data-open-movie="${movie.id}">
              <h3 class="card-title">${esc(movie.title || 'Untitled')}</h3>
              <div class="card-meta-row tabular">
                <span>${esc(year)}</span>
                <span class="card-meta-rating-inline">• ★ ${rating}</span>
                ${options.extraMeta ? `<span>• ${esc(options.extraMeta)}</span>` : ''}
              </div>
              ${movie.overview ? `<p class="card-overview">${esc(movie.overview)}</p>` : ''}
            </div>
          </article>

      function renderSkeletonGrid(count = 12) {
        return `<div class="movies-grid">${Array.from({ length: count }, () => `<div class="skeleton skeleton-card"></div>`).join('')}</div>`;
      }

      async function switchView(viewName, opts = {}) {
        state.view = viewName;
        syncNavBadges();
        if (viewName !== 'search' && el.searchInput.value && !opts.keepSearchInput) {
          el.searchInput.value = '';
          el.searchClear.classList.remove('visible');
        }
        if (viewName === 'home') {
          await loadAndRenderHome();
        } else if (viewName === 'explore') {
          await loadAndRenderExplore(true);
        } else if (viewName === 'search') {
          await loadAndRenderSearch(true);
        } else if (viewName === 'saved') {
          renderSavedView();
        } else if (viewName === 'history') {
          renderHistoryView();
        }
        window.scrollTo({ top: 0, behavior: state.settings.reducedMotion ? 'auto' : 'smooth' });
      }

      async function ensureGenres(signal) {
        if (state.genres.length) return;
        try {
          const data = await tmdbFetch('/genre/movie/list', {}, signal);
          state.genres = data.genres || [];
          state.genreMap = new Map(state.genres.map(g => [g.id, g.name]));
        } catch {}
      }

      async function loadAndRenderHome() {
        const signal = abortController('view');
        el.main.innerHTML = `
          <div class="skeleton" style="height:380px;margin-bottom:28px;border-radius:24px;"></div>
          ${renderSkeletonGrid(6)}
        `;
        try {
          await ensureGenres(signal);
          const [trendRes, nowRes, topRes] = await Promise.all([
            tmdbFetch('/trending/movie/week', { page: 1 }, signal),
            tmdbFetch('/movie/now_playing', { page: 1 }, signal),
            tmdbFetch('/movie/top_rated', { page: 1 }, signal)
          ]);

          state.home.trending = trendRes.results || [];
          state.home.nowPlaying = nowRes.results || [];
          state.home.topRated = topRes.results || [];
          state.home.spotlights = state.home.trending.filter(m => m.backdrop_path).slice(0, 5);
          state.home.spotlightIdx = 0;

          const seeds = [...state.watchlist, ...state.history];
          let recMovies = [];
          let recLabel = 'Popular in Cinema';
          if (seeds.length > 0) {
            const topSeed = seeds[0];
            try {
              const recRes = await tmdbFetch(`/movie/${topSeed.id}/recommendations`, { page: 1 }, signal);
              if (recRes.results && recRes.results.length >= 4) {
                recMovies = recRes.results;
                recLabel = `Because you ${isSaved(topSeed.id) ? 'saved' : 'watched'} ${topSeed.title}`;
              }
            } catch {}

            if (!recMovies.length) {
              const genreFreq = new Map();
              seeds.forEach(s => (s.genre_ids || []).forEach(gid => genreFreq.set(gid, (genreFreq.get(gid) || 0) + 1)));
              const topGenre = [...genreFreq.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
              if (topGenre) {
                const disc = await tmdbFetch('/discover/movie', { with_genres: topGenre, sort_by: 'popularity.desc', 'vote_count.gte': 100 }, signal);
                recMovies = disc.results || [];
                recLabel = `Picked from ${state.genreMap.get(topGenre) || 'Your Favorite'} Genres`;
              }
            }
          }
          if (!recMovies.length) {
            const upc = await tmdbFetch('/movie/upcoming', { page: 1 }, signal);
            recMovies = upc.results || [];
            recLabel = 'Upcoming Releases';
          }
          state.home.recommended = recMovies;
          state.home.recommendedLabel = recLabel;

          el.networkBanner.classList.remove('visible');
          renderHomeView(true);
        } catch (err) {
          if (err.name === 'AbortError') return;
          el.networkBanner.classList.add('visible');
          el.main.innerHTML = `
            <div class="empty-state">
              <h3>Unable to reach TMDB Cinema Feed</h3>
              <p>Check your connection and retry. Your Saved Watchlist (${state.watchlist.length}) and History (${state.history.length}) are still available offline.</p>
              <button class="btn-primary" id="homeRetryBtn">Retry Connection</button>
            </div>
          `;
          document.getElementById('homeRetryBtn')?.addEventListener('click', loadAndRenderHome);
        }
      }

      function renderHeroHtml(movie) {
        if (!movie) return '';
        const backdrop = imgUrl(movie.backdrop_path || movie.poster_path, 'w1280');
        const saved = isSaved(movie.id);
        const genres = (movie.genre_ids || []).slice(0, 3).map(id => state.genreMap.get(id)).filter(Boolean).join(' • ');
        const payload = esc(JSON.stringify({
          id: movie.id,
          title: movie.title,
          poster_path: movie.poster_path,
          backdrop_path: movie.backdrop_path,
          release_date: movie.release_date,
          vote_average: movie.vote_average,
          overview: movie.overview,
          genre_ids: movie.genre_ids || []
        }));

        return `
          <section class="hero-section" aria-label="Featured Spotlight">
            ${backdrop ? `<img class="hero-backdrop" src="${backdrop}" alt="${esc(movie.title)} backdrop" decoding="async">` : ''}
            <div class="hero-scrim"></div>
            <div class="hero-content">
              <div class="hero-eyebrow">Featured Spotlight • Trending #${state.home.spotlightIdx + 1}</div>
              <h1 class="hero-title">${esc(movie.title)}</h1>
              <div class="hero-meta tabular">
                <span class="rating-pill">★ ${formatRating(movie.vote_average)}</span>
                <span>${formatYear(movie.release_date)}</span>
                ${genres ? `<span>• ${esc(genres)}</span>` : ''}
              </div>
              <p class="hero-overview">${esc(movie.overview || 'Explore full cast, trailers, and instant multi-server streaming.')}</p>
              <div class="hero-actions">
                <button class="btn-primary" data-open-movie="${movie.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  Watch Now
                </button>
                <button
                  class="btn-secondary ${saved ? 'saved' : ''}"
                  data-save-id="${movie.id}"
                  data-save-style="hero"
                  data-movie-payload="${payload}"
                  aria-pressed="${saved}"
                >
                  ${saved
                    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Saved in Watchlist`
                    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Save to Watchlist`
                  }
                </button>
              </div>
            </div>
            <div class="hero-dots" aria-label="Spotlight selector">
              ${state.home.spotlights.map((_, idx) => `
                <button class="hero-dot ${idx === state.home.spotlightIdx ? 'active' : ''}" data-spotlight-idx="${idx}" aria-label="Show spotlight ${idx + 1}"></button>
              `).join('')}
            </div>
          </section>
        `;
      }

      function renderRail(title, movies, presetAction, subtitle = '', historyControls = false) {
        if (!movies || !movies.length) return '';
        return `
          <section class="rail-section">
            <div class="section-head">
              <div class="section-title-group">
                <span class="section-accent" aria-hidden="true"></span>
                <h2 class="section-title">${esc(title)}</h2>
                ${subtitle ? `<span class="section-subtitle">${esc(subtitle)}</span>` : ''}
              </div>
              ${presetAction ? `
                <button class="link-btn" data-rail-explore="${esc(presetAction)}">
                  View All
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
              ` : ''}
            </div>
            <div class="rail-track">
              ${movies.map(m => renderMovieCard(m, { showHistoryControls: historyControls })).join('')}
            </div>
          </section>
        `;
      }

      function renderHomeView() {
        const heroMovie = state.home.spotlights[state.home.spotlightIdx] || state.home.trending[0];
        el.main.innerHTML = `
          ${renderHeroHtml(heroMovie)}
          ${state.history.length ? renderRail('Continue Watching', state.history.slice(0, 12), 'history', `${state.history.length} watched`, true) : ''}
          ${renderRail('Trending This Week', state.home.trending, 'trending')}
          ${renderRail('Now Playing in Cinemas', state.home.nowPlaying, 'now_playing')}
          ${renderRail('Top Rated Classics', state.home.topRated, 'top_rated')}
          ${renderRail('Recommended For You', state.home.recommended, 'recommended', state.home.recommendedLabel)}
        `;
      }

      function buildExploreParams(page) {
        const ex = state.explore;
        const params = {
          page,
          sort_by: ex.sort,
          include_adult: false
        };
        if (ex.genreId) params.with_genres = ex.genreId;
        if (ex.minRating) params['vote_average.gte'] = ex.minRating;

        if (ex.sort === 'vote_average.desc') {
          params['vote_count.gte'] = 250;
        } else if (ex.sort === 'primary_release_date.desc') {
          params['primary_release_date.lte'] = new Date().toISOString().slice(0, 10);
          params['vote_count.gte'] = 15;
        }

        if (ex.yearFilter) {
          if (/^\d{4}$/.test(ex.yearFilter)) {
            params.primary_release_year = ex.yearFilter;
          } else if (ex.yearFilter === '2020s') {
            params['primary_release_date.gte'] = '2020-01-01';
            params['primary_release_date.lte'] = '2029-12-31';
          } else if (ex.yearFilter === '2010s') {
            params['primary_release_date.gte'] = '2010-01-01';
            params['primary_release_date.lte'] = '2019-12-31';
          } else if (ex.yearFilter === '2000s') {
            params['primary_release_date.gte'] = '2000-01-01';
            params['primary_release_date.lte'] = '2009-12-31';
          } else if (ex.yearFilter === '1990s') {
            params['primary_release_date.gte'] = '1990-01-01';
            params['primary_release_date.lte'] = '1999-12-31';
          } else if (ex.yearFilter === '1980s') {
            params['primary_release_date.gte'] = '1980-01-01';
            params['primary_release_date.lte'] = '1989-12-31';
          } else if (ex.yearFilter === 'classic') {
            params['primary_release_date.lte'] = '1979-12-31';
          }
        }
        return params;
      }

      function renderFilterBarHtml() {
        const ex = state.explore;
        return `
          <section class="filter-panel" aria-label="Movie Filters">
            <div class="section-head" style="margin-bottom:0">
              <div class="section-title-group">
                <span class="section-accent"></span>
                <h1 class="section-title">${esc(ex.presetTitle || 'Explore Cinema')}</h1>
                <span class="section-subtitle tabular" id="exploreCountLabel">
                  ${ex.totalResults ? `${ex.totalResults.toLocaleString()} titles` : ''}
                </span>
              </div>
              <button class="link-btn" id="resetFiltersBtn">Reset Filters</button>
            </div>

            <div class="filter-controls-row">
              <label class="control-field">
                <span class="control-label">Genre</span>
                <select class="select-input" id="filterGenreSelect">
                  <option value="">All Genres</option>
                  ${state.genres.map(g => `<option value="${g.id}" ${String(ex.genreId) === String(g.id) ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
                </select>
              </label>

              <label class="control-field">
                <span class="control-label">Sort By</span>
                <select class="select-input" id="filterSortSelect">
                  <option value="popularity.desc" ${ex.sort === 'popularity.desc' ? 'selected' : ''}>Trending / Popular</option>
                  <option value="vote_average.desc" ${ex.sort === 'vote_average.desc' ? 'selected' : ''}>Top Rated (250+ votes)</option>
                  <option value="primary_release_date.desc" ${ex.sort === 'primary_release_date.desc' ? 'selected' : ''}>Newest Releases</option>
                </select>
              </label>

              <label class="control-field">
                <span class="control-label">Year / Era</span>
                <select class="select-input" id="filterYearSelect">
                  ${YEAR_FILTERS.map(y => `<option value="${y.value}" ${ex.yearFilter === y.value ? 'selected' : ''}>${esc(y.label)}</option>`).join('')}
                </select>
              </label>

              <label class="control-field">
                <span class="control-label">Minimum Rating</span>
                <select class="select-input" id="filterRatingSelect">
                  <option value="" ${ex.minRating === '' ? 'selected' : ''}>Any Rating</option>
                  <option value="6" ${ex.minRating === '6' ? 'selected' : ''}>6.0+ Good</option>
                  <option value="7" ${ex.minRating === '7' ? 'selected' : ''}>7.0+ Great</option>
                  <option value="8" ${ex.minRating === '8' ? 'selected' : ''}>8.0+ Acclaimed</option>
                </select>
              </label>
            </div>

            <div class="genre-chips-row" role="tablist" aria-label="Quick Genre Filter">
              <button class="filter-chip ${!ex.genreId ? 'active' : ''}" data-genre-chip="">All</button>
              ${state.genres.map(g => `
                <button class="filter-chip ${String(ex.genreId) === String(g.id) ? 'active' : ''}" data-genre-chip="${g.id}">${esc(g.name)}</button>
              `).join('')}
            </div>
          </section>
        `;
      }

      async function loadAndRenderExplore(resetPage = true) {
        const signal = abortController('view');
        if (resetPage) {
          state.explore.page = 1;
          state.explore.items = [];
        }
        await ensureGenres(signal);
        if (resetPage) {
          el.main.innerHTML = `${renderFilterBarHtml()}${renderSkeletonGrid(12)}`;
        }
        try {
          const data = await tmdbFetch('/discover/movie', buildExploreParams(state.explore.page), signal);
          const newItems = data.results || [];
          state.explore.items = resetPage ? newItems : [...state.explore.items, ...newItems];
          state.explore.totalPages = Math.min(data.total_pages || 1, 500);
          state.explore.totalResults = data.total_results || 0;
          renderExploreGrid();
        } catch (err) {
          if (err.name === 'AbortError') return;
          el.main.innerHTML = `
            ${renderFilterBarHtml()}
            <div class="empty-state">
              <h3>Could not load movies</h3>
              <p>There was a network issue reaching TMDB.</p>
              <button class="btn-primary" id="retryExploreBtn">Retry</button>
            </div>
          `;
          document.getElementById('retryExploreBtn')?.addEventListener('click', () => loadAndRenderExplore(true));
        }
      }

      function renderExploreGrid() {
        const ex = state.explore;
        const hasMore = ex.page < ex.totalPages;
        const bodyHtml = ex.items.length
          ? `
            <div class="movies-grid">${ex.items.map(m => renderMovieCard(m)).join('')}</div>
            ${hasMore ? `
              <div class="load-more-wrap">
                <button class="btn-secondary" id="exploreLoadMoreBtn">
                  Load More Movies (Page ${ex.page} of ${ex.totalPages})
                </button>
              </div>
            ` : ''}
          `
          : `
            <div class="empty-state">
              <h3>No movies match those filters</h3>
              <p>Try widening your release era, minimum rating, or genre selection.</p>
              <button class="btn-primary" id="emptyResetFiltersBtn">Reset All Filters</button>
            </div>
          `;
        el.main.innerHTML = `${renderFilterBarHtml()}${bodyHtml}`;
      }

      async function loadAndRenderSearch(resetPage = true) {
        const q = state.search.query.trim();
        if (!q) {
          switchView('home');
          return;
        }
        const signal = abortController('view');
        if (resetPage) {
          state.search.page = 1;
          state.search.items = [];
          el.main.innerHTML = `
            <div class="section-head">
              <div class="section-title-group">
                <span class="section-accent"></span>
                <h1 class="section-title">Searching "${esc(q)}"…</h1>
              </div>
            </div>
            ${renderSkeletonGrid(10)}
          `;
        }
        try {
          const data = await tmdbFetch('/search/movie', { query: q, page: state.search.page, include_adult: false }, signal);
          const results = data.results || [];
          state.search.items = resetPage ? results : [...state.search.items, ...results];
          state.search.totalPages = Math.min(data.total_pages || 1, 500);
          state.search.totalResults = data.total_results || 0;
          renderSearchGrid();
        } catch (err) {
          if (err.name === 'AbortError') return;
          el.main.innerHTML = `
            <div class="empty-state">
              <h3>Search failed</h3>
              <p>Could not fetch search results for "${esc(q)}".</p>
              <button class="btn-primary" id="retrySearchBtn">Retry Search</button>
            </div>
          `;
          document.getElementById('retrySearchBtn')?.addEventListener('click', () => loadAndRenderSearch(true));
        }
      }

      function renderSearchGrid() {
        const s = state.search;
        const hasMore = s.page < s.totalPages;
        el.main.innerHTML = `
          <div class="section-head">
            <div class="section-title-group">
              <span class="section-accent"></span>
              <h1 class="section-title">Results for "${esc(s.query)}"</h1>
              <span class="section-subtitle tabular">${s.totalResults.toLocaleString()} matches</span>
            </div>
            <button class="link-btn" id="clearSearchViewBtn">Clear Search</button>
          </div>
          ${s.items.length
            ? `
              <div class="movies-grid">${s.items.map(m => renderMovieCard(m)).join('')}</div>
              ${hasMore ? `
                <div class="load-more-wrap">
                  <button class="btn-secondary" id="searchLoadMoreBtn">
                    Load More Results (Page ${s.page} of ${s.totalPages})
                  </button>
                </div>
              ` : ''}
            `
            : `
              <div class="empty-state">
                <h3>No movies found for "${esc(s.query)}"</h3>
                <p>Check spelling or explore curated cinema collections instead.</p>
                <button class="btn-primary" data-view="explore">Browse All Movies</button>
              </div>
            `
          }
        `;
      }

      function renderSavedView() {
        abortController('view');
        const list = state.watchlist;
        el.main.innerHTML = `
          <div class="section-head">
            <div class="section-title-group">
              <span class="section-accent"></span>
              <h1 class="section-title">Saved Watchlist</h1>
              <span class="section-subtitle tabular">${list.length} movies</span>
            </div>
            ${list.length ? `<button class="btn-danger-outline" id="clearSavedViewBtn">Clear Watchlist</button>` : ''}
          </div>
          ${list.length
            ? `<div class="movies-grid">${list.map(m => renderMovieCard(m)).join('')}</div>`
            : `
              <div class="empty-state">

      function teardownActivePlayers() {
        const frames = el.detailContent.querySelectorAll('iframe');
        frames.forEach(frame => {
          try { frame.src = 'about:blank'; } catch {}
          frame.remove();
        });
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        el.detailContent.querySelectorAll('.pseudo-fullscreen').forEach(node => {
          node.classList.remove('pseudo-fullscreen');
        });
      }

      function togglePlayerFullscreen() {
        const stage = document.getElementById('playerAspectStage');
        if (!stage) return;
        const isFs = document.fullscreenElement === stage || stage.classList.contains('pseudo-fullscreen');
        if (isFs) {
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
          stage.classList.remove('pseudo-fullscreen');
        } else {
          if (stage.requestFullscreen) {
            stage.requestFullscreen().catch(() => {
              stage.classList.add('pseudo-fullscreen');
            });
          } else {
            stage.classList.add('pseudo-fullscreen');
          }
        }
      }

      function openMovieModal(movieId, preferredServerId = null) {
        const historyEntry = state.history.find(h => h.id === Number(movieId));
        const serverId = preferredServerId || historyEntry?.serverId || state.settings.defaultServer || 'vidlink';

        const top = state.modal.stack[state.modal.stack.length - 1];
        if (!top || top.type !== 'movie' || top.id !== Number(movieId)) {
          state.modal.stack.push({
            type: 'movie',
            id: Number(movieId),
            serverId,
            mode: 'stream',
            trailerKey: '',
            streamLoaded: !!state.settings.autoPlayStream
          });
        }
        openDetailModalBackdrop();
        loadTopModalEntry();
      }

      function openPersonModal(personId) {
        state.modal.stack.push({
          type: 'person',
          id: Number(personId),
          sort: 'popularity',
          roleFilter: 'all',
          bioExpanded: false
        });
        openDetailModalBackdrop();
        loadTopModalEntry();

      async function loadTopModalEntry() {
        const entry = state.modal.stack[state.modal.stack.length - 1];

        teardownActivePlayers();
        const signal = abortController('modal');

        if (entry.type === 'movie') {

      async function renderMovieModalLoadingAndFetch(entry, signal) {
        el.detailContent.innerHTML = `
          <div style="padding:26px;">
            <div class="skeleton" style="width:100%;aspect-ratio:16/9;margin-bottom:20px;"></div>
            <div class="skeleton" style="height:28px;width:55%;margin-bottom:12px;"></div>

            <div class="skeleton" style="height:80px;width:100%;"></div>
          </div>
        `;
        try {
          const [movie, credits, videos, images, recs] = await Promise.all([
            tmdbFetch(`/movie/${entry.id}`, {}, signal),
            tmdbFetch(`/movie/${entry.id}/credits`, {}, signal),
            tmdbFetch(`/movie/${entry.id}/videos`, {}, signal),
            tmdbFetch(`/movie/${entry.id}/images`, { include_image_language: 'en,null' }, signal),
            tmdbFetch(`/movie/${entry.id}/recommendations`, { page: 1 }, signal)
          ]);

          let recList = recs.results || [];
          if (recList.length < 4) {
            try {
              const sim = await tmdbFetch(`/movie/${entry.id}/similar`, { page: 1 }, signal);
              recList = recList.length ? recList : (sim.results || []);
            } catch {}
          }

          let collection = null;
          if (movie.belongs_to_collection?.id) {
            try {
              collection = await tmdbFetch(`/collection/${movie.belongs_to_collection.id}`, {}, signal);
            } catch {}
          }

          const ytVideos = (videos.results || []).filter(v => v.site === 'YouTube' && ['Trailer', 'Teaser', 'Clip', 'Featurette'].includes(v.type));
          if (!entry.trailerKey && ytVideos.length) {
            const officialTrailer = ytVideos.find(v => v.type === 'Trailer' && v.official) || ytVideos.find(v => v.type === 'Trailer') || ytVideos[0];
            entry.trailerKey = officialTrailer.key;
          }

          state.modal.currentMovieData = { movie, credits, ytVideos, images, recList, collection };
          document.getElementById('modalAccessibleTitle').textContent = movie.title || 'Movie Details';

          if (entry.streamLoaded) {
            recordHistory(movie, entry.serverId);

          renderMovieModalHtml(entry, state.modal.currentMovieData);

          if (err.name === 'AbortError') return;
          el.detailContent.innerHTML = `

      function deduplicatePersonCredits(credits, roleFilter) {
        const map = new Map();
        const castList = credits.cast || [];
        const crewList = credits.crew || [];

        if (roleFilter === 'all' || roleFilter === 'acting') {
          castList.forEach(c => {
            if (!c.id) return;
            const prev = map.get(c.id);
            const roleStr = c.character ? `as ${c.character}` : 'Actor';
            if (!prev) {
              map.set(c.id, { ...c, creditRole: roleStr, isActing: true });
            }
          });
        }
        if (roleFilter === 'all' || roleFilter === 'crew') {
          crewList.forEach(c => {
            if (!c.id) return;
            const prev = map.get(c.id);
            if (!prev) {
              map.set(c.id, { ...c, creditRole: c.job || c.department || 'Crew', isActing: false });
            } else if (c.job && !prev.creditRole.includes(c.job)) {
              prev.creditRole = `${prev.creditRole} • ${c.job}`;
            }
          });
        }
        return [...map.values()];
      }

      function renderPersonModalHtml(entry, data) {
        const { person, credits } = data;
        const portrait = imgUrl(person.profile_path, 'w342');

        const prevMovieTitle = prevEntry?.type === 'movie' && state.modal.currentMovieData?.movie?.id === prevEntry.id
          ? state.modal.currentMovieData.movie.title
          : 'Movie';

        let films = deduplicatePersonCredits(credits, entry.roleFilter);
        if (entry.sort === 'popularity') {
          films.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
        } else if (entry.sort === 'newest') {
          films.sort((a, b) => (b.release_date || '0000').localeCompare(a.release_date || '0000'));
        } else if (entry.sort === 'oldest') {
          films.sort((a, b) => (a.release_date || '9999').localeCompare(b.release_date || '9999'));
        } else if (entry.sort === 'rating') {
          films.sort((a, b) => ((b.vote_count > 20 ? b.vote_average : 0) - (a.vote_count > 20 ? a.vote_average : 0)));
        }

        const lifeText = person.birthday
          ? `${person.birthday}${person.deathday ? ` — ${person.deathday}` : ''}`
          : '';

        el.detailContent.innerHTML = `
          <div class="person-topbar" style="padding-right:64px;">
            ${prevEntry ? `<button class="tool-btn" id="modalStackBackBtn">← Back to ${esc(prevMovieTitle)}</button>` : `<span></span>`}

            <div>
              ${portrait

      function updateSetting(key, value) {
        state.settings[key] = value;
        saveJson(STORAGE_KEYS.SETTINGS, state.settings);
        applySettingsToDOM();
        if (key === 'showRecommendations' && state.modal.open) {
          const top = state.modal.stack[state.modal.stack.length - 1];
          if (top?.type === 'movie' && state.modal.currentMovieData) {
            renderMovieModalHtml(top, state.modal.currentMovieData);
          }
        }
      }

      function exportBackupJson() {
        const payload = {
          app: 'CineVault Pro',
          version: 1,
          exportedAt: new Date().toISOString(),
          settings: state.settings,
          watchlist: state.watchlist,
          history: state.history,
          recentSearches: state.recentSearches
        };
        const jsonStr = JSON.stringify(payload, null, 2);
        if (window.AndroidBridge && typeof window.AndroidBridge.exportJson === 'function') {
          window.AndroidBridge.exportJson(jsonStr, `cinevault-backup-${new Date().toISOString().slice(0, 10)}.json`);
        }
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cinevault-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(jsonStr).catch(() => {});
        }
        showToast('Backup exported as JSON (and copied to clipboard)', 'success');
      }

      function importBackupJson(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result || '{}'));
            if (!data || typeof data !== 'object' || (!Array.isArray(data.watchlist) && !Array.isArray(data.history) && !data.settings)) {
              throw new Error('Invalid backup structure');
            }
            if (data.settings && typeof data.settings === 'object') {
              state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
              saveJson(STORAGE_KEYS.SETTINGS, state.settings);
              applySettingsToDOM();
            }
            if (Array.isArray(data.watchlist)) {
              state.watchlist = data.watchlist.filter(m => m && typeof m.id === 'number' && m.title);
              saveJson(STORAGE_KEYS.WATCHLIST, state.watchlist);
            }
            if (Array.isArray(data.history)) {
              state.history = data.history.filter(m => m && typeof m.id === 'number' && m.title);
              saveJson(STORAGE_KEYS.HISTORY, state.history);
            }
            if (Array.isArray(data.recentSearches)) {
              state.recentSearches = data.recentSearches.filter(q => typeof q === 'string');
              saveJson(STORAGE_KEYS.RECENT, state.recentSearches);
            }
            syncNavBadges();
            renderRecentSearches();
            renderSettingsModal();
            if (state.view === 'saved') renderSavedView();
            else if (state.view === 'history') renderHistoryView();
            else if (state.view === 'home') renderHomeView();
            showToast('Backup restored successfully', 'success');
          } catch {
            showToast('Invalid JSON backup file', 'error');
          }
        };
        reader.readAsText(file);
      }

      let searchDebounce = null;

      el.searchInput.addEventListener('input', () => {
        const val = el.searchInput.value;
        el.searchClear.classList.toggle('visible', val.length > 0);
        clearTimeout(searchDebounce);
        if (!val.trim()) {
          if (state.view === 'search') switchView('home');
          return;
        }
        searchDebounce = setTimeout(() => {
          state.search.query = val.trim();
          state.view = 'search';
          syncNavBadges();
          loadAndRenderSearch(true);
        }, 380);
      });

      el.searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          clearTimeout(searchDebounce);
          const q = el.searchInput.value.trim();
          if (q) {
            addRecentSearch(q);
            state.search.query = q;
            state.view = 'search';
            syncNavBadges();
            loadAndRenderSearch(true);
          }
        }
      });

      el.searchClear.addEventListener('click', () => {
        el.searchInput.value = '';
        el.searchClear.classList.remove('visible');
        if (state.view === 'search') switchView('home');
        el.searchInput.focus();
      });

      el.recentBar.addEventListener('click', e => {
        const runBtn = e.target.closest('[data-recent-query]');
        if (runBtn) {
          const q = runBtn.dataset.recentQuery;
          el.searchInput.value = q;
          el.searchClear.classList.add('visible');
          state.search.query = q;
          state.view = 'search';
          syncNavBadges();
          loadAndRenderSearch(true);
          return;
        }
        const delBtn = e.target.closest('[data-remove-recent]');
        if (delBtn) {
          removeRecentSearch(delBtn.dataset.removeRecent);
        }
      });

      document.addEventListener('click', e => {
        const saveBtn = e.target.closest('[data-save-id]');
        if (saveBtn) {
          e.stopPropagation();
          try {
            const payload = JSON.parse(saveBtn.dataset.moviePayload || '{}');
            if (payload.id) toggleWatchlist(payload);
          } catch {}
          return;
        }

        const remHist = e.target.closest('[data-remove-history]');
        if (remHist) {
          e.stopPropagation();
          removeHistoryItem(remHist.dataset.removeHistory);
          return;
        }

        const viewBtn = e.target.closest('[data-view]');
        if (viewBtn) {
          switchView(viewBtn.dataset.view);
          return;
        }

        const openMovie = e.target.closest('[data-open-movie]');
        if (openMovie) {
          if (el.searchInput.value.trim() && state.view === 'search') {
            addRecentSearch(el.searchInput.value.trim());
          }
          openMovieModal(openMovie.dataset.openMovie);
          return;
        }

        const spotDot = e.target.closest('[data-spotlight-idx]');
        if (spotDot) {
          state.home.spotlightIdx = Number(spotDot.dataset.spotlightIdx);
          renderHomeView();
          return;
        }

        const railExplore = e.target.closest('[data-rail-explore]');
        if (railExplore) {
          const preset = railExplore.dataset.railExplore;
          if (preset === 'history') {
            switchView('history');
            return;
          }
          state.explore.genreId = '';
          state.explore.yearFilter = '';
          state.explore.minRating = '';
          if (preset === 'top_rated') {
            state.explore.sort = 'vote_average.desc';
            state.explore.presetTitle = 'Top Rated Classics';
          } else if (preset === 'now_playing') {
            state.explore.sort = 'primary_release_date.desc';
            state.explore.yearFilter = '2026';
            state.explore.presetTitle = 'Now Playing & Recent Releases';
          } else {
            state.explore.sort = 'popularity.desc';
            state.explore.presetTitle = preset === 'recommended' ? 'Recommended Cinema' : 'Trending Movies';
          }
          switchView('explore');
        }
      });

      el.main.addEventListener('click', e => {
        if (e.target.closest('#resetFiltersBtn') || e.target.closest('#emptyResetFiltersBtn')) {
          state.explore.genreId = '';
          state.explore.sort = 'popularity.desc';
          state.explore.yearFilter = '';
          state.explore.minRating = '';
          state.explore.presetTitle = 'Explore Movies';
          loadAndRenderExplore(true);
          return;
        }
        const chip = e.target.closest('[data-genre-chip]');
        if (chip) {
          state.explore.genreId = chip.dataset.genreChip;
          state.explore.presetTitle = state.explore.genreId
            ? `${state.genreMap.get(Number(state.explore.genreId)) || 'Genre'} Movies`
            : 'Explore Movies';
          loadAndRenderExplore(true);
          return;
        }
        if (e.target.closest('#exploreLoadMoreBtn')) {
          state.explore.page += 1;
          loadAndRenderExplore(false);
          return;
        }
        if (e.target.closest('#searchLoadMoreBtn')) {
          state.search.page += 1;
          loadAndRenderSearch(false);
          return;
        }
        if (e.target.closest('#clearSearchViewBtn')) {
          el.searchInput.value = '';
          el.searchClear.classList.remove('visible');
          switchView('home');
          return;
        }
        if (e.target.closest('#clearSavedViewBtn')) {
          state.watchlist = [];
          saveJson(STORAGE_KEYS.WATCHLIST, []);
          syncNavBadges();
          renderSavedView();
          showToast('Saved Watchlist cleared');
          return;
        }
        if (e.target.closest('#clearHistoryViewBtn')) {
          state.history = [];
          saveJson(STORAGE_KEYS.HISTORY, []);
          syncNavBadges();
          renderHistoryView();
          showToast('Watch History cleared');
        }
      });

      el.main.addEventListener('change', e => {
        if (e.target.id === 'filterGenreSelect') {
          state.explore.genreId = e.target.value;
          state.explore.presetTitle = state.explore.genreId
            ? `${state.genreMap.get(Number(state.explore.genreId)) || 'Genre'} Movies`
            : 'Explore Movies';
          loadAndRenderExplore(true);

          state.explore.sort = e.target.value;
          loadAndRenderExplore(true);
        } else if (e.target.id === 'filterYearSelect') {
          state.explore.yearFilter = e.target.value;
          loadAndRenderExplore(true);
