<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flix Vision</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
        :root {
            --bg-main: #070b12;
            --bg-card: #111622;
            --accent-cyan: #06b6d4;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .poster-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform;
        }
        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col overflow-x-hidden">

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed top-16 right-4 z-50 bg-cyan-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform translate-y-[-10px] flex items-center space-x-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Notification</span>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-[#0e131d] border-b border-gray-800/40 px-4 py-3.5 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3.5 min-w-0 flex-1 mr-2">
            <button id="openSidebarBtn" class="text-gray-200 hover:text-white p-1 focus:outline-none transition shrink-0" title="Menu">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="15" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="13" y2="18"></line>
                </svg>
            </button>
            <h1 id="pageTitle" class="text-xs sm:text-base font-extrabold text-white tracking-wider truncate max-w-[120px] sm:max-w-none uppercase">
                MOVIES: TRENDING
            </h1>
        </div>

        <div class="flex items-center space-x-4 text-gray-200 text-xl shrink-0">
            <button id="castBtn" class="hover:text-cyan-400 transition p-1" title="Chromecast">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path>
                    <line x1="2" y1="20" x2="2.01" y2="20"></line>
                </svg>
            </button>
            <button id="searchToggleBtn" class="hover:text-cyan-400 transition p-1" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button onclick="openFilterModal()" class="hover:text-cyan-400 transition p-1" title="Filter"><i class="fa-solid fa-filter"></i></button>
            <button id="menu3DotsBtn" class="hover:text-cyan-400 transition p-1" title="More"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
    </header>

    <!-- Search Bar Container -->
    <div id="searchBarContainer" class="hidden bg-[#111723] px-4 py-3 border-b border-gray-800 space-y-3">
        <div class="relative max-w-xl mx-auto flex items-center">
            <input type="text" id="searchInput" placeholder="Search Movies, TV Shows, People..." 
                class="w-full bg-[#070b12] text-sm text-gray-100 placeholder-gray-500 rounded-lg pl-9 pr-8 py-2 border border-gray-700 focus:outline-none focus:border-cyan-500">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-xs text-gray-400"></i>
            <button id="clearSearchBtn" class="absolute right-3 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="searchTabsContainer" class="flex justify-center space-x-3 text-xs font-bold">
            <button onclick="switchSearchTab('movie')" id="searchTabMovie" class="bg-cyan-600 text-white px-4 py-1.5 rounded-full shadow transition">Movies</button>
            <button onclick="switchSearchTab('tv')" id="searchTabTv" class="bg-[#111622] text-gray-400 border border-gray-700 px-4 py-1.5 rounded-full shadow transition">Series</button>
            <button onclick="switchSearchTab('person')" id="searchTabPerson" class="bg-[#111622] text-gray-400 border border-gray-700 px-4 py-1.5 rounded-full shadow transition">People</button>
        </div>
    </div>

    <!-- Category Tabs Navigation -->
    <nav class="bg-[#0e131d] px-4 text-xs font-bold uppercase tracking-wider">
        <div class="flex space-x-6 overflow-x-auto hide-scrollbar">
            <button onclick="switchCategory('trending')" id="tabTrending" class="py-3 text-white border-b-2 border-cyan-400 transition whitespace-nowrap">TRENDING</button>
            <button onclick="switchCategory('theater')" id="tabInTheater" class="py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">IN THEATER</button>
            <button onclick="switchCategory('popular')" id="tabPopular" class="py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">POPULAR</button>
        </div>
    </nav>

    <!-- Network Logos & Top Bar Filters (Exact like Flix Vision Image 1) -->
    <section class="bg-[#070b12] py-2.5 px-3 border-b border-gray-800/30">
        <div id="networkChipsContainer" class="flex items-center space-x-3 overflow-x-auto hide-scrollbar"></div>
    </section>

    <!-- Main Grid Content -->
    <main class="max-w-7xl mx-auto px-3 py-4 space-y-6 flex-1 w-full">
        <div id="customViewHeader" class="hidden flex items-center justify-between border-b border-gray-800 pb-2">
            <h2 id="customViewTitle" class="text-sm font-extrabold text-cyan-400 uppercase tracking-wider">VIEW TITLE</h2>
            <button onclick="currentCustomView = null; renderGrid(cachedItems); document.getElementById('customViewHeader').classList.add('hidden')" class="text-xs text-gray-400 hover:text-white">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Main
            </button>
        </div>

        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 sm:gap-4"></div>
        
        <div class="text-center py-4">
            <button onclick="handleLoadMore()" id="loadMoreBtn" class="bg-[#111622] hover:bg-cyan-600 hover:text-white border border-gray-800 text-gray-200 font-extrabold px-8 py-3 rounded-xl text-xs transition shadow-xl">
                LOAD MORE CONTENT...
            </button>
        </div>
    </main>

    <!-- Movie Details Modal (Exact like Image 3, 4, 5) -->
    <div id="movieDetailModal" class="hidden fixed inset-0 bg-[#070b12] z-50 overflow-y-auto hide-scrollbar">
        <div class="relative w-full h-72 sm:h-96 bg-gray-900">
            <img id="detailBackdrop" src="" class="w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-t from-[#070b12] via-[#070b12]/40 to-transparent"></div>
            
            <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-10 text-white text-lg">
                <button id="closeDetailModalBtn" class="bg-black/50 backdrop-blur-md p-2 rounded-full hover:bg-black/70"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="flex items-center space-x-3 bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full">
                    <button id="detailFavoriteBtn" class="hover:text-red-500 transition"><i class="fa-regular fa-heart"></i></button>
                    <button onclick="openSettingsModal()" class="hover:text-cyan-400 transition"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <div class="absolute bottom-4 left-4 right-4 space-y-2">
                <h2 id="detailTitle" class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow-md"></h2>
                <div class="flex flex-wrap items-center gap-2 text-xs font-semibold text-gray-300">
                    <span id="detailRatingBadge" class="border border-cyan-500 text-cyan-400 px-1 rounded text-[10px] font-bold">PG-13</span>
                    <span id="detailYear">2026</span><span>•</span>
                    <span id="detailRuntime">2h 15m</span><span>•</span>
                    <span id="detailGenres" class="truncate max-w-[180px]"></span><span>•</span>
                    <span id="detailTypeTag" class="text-cyan-400 font-bold">Film</span>
                    <span class="bg-amber-500 text-black px-1 rounded text-[10px] font-black">4K UHD</span>
                </div>
            </div>
        </div>

        <div class="p-4 space-y-6 max-w-5xl mx-auto">
            <div class="flex items-center space-x-3">
                <button id="detailPlayBtn" class="flex-1 bg-white hover:bg-gray-200 text-black font-extrabold py-3 rounded-xl flex items-center justify-center space-x-2 shadow-lg transition">
                    <i class="fa-solid fa-play text-black text-sm"></i>
                    <span>PLAY SOURCE</span>
                </button>
                <button id="detailTrailerBtn" class="flex-1 bg-[#151c28] hover:bg-[#1e2738] text-white font-extrabold py-3 rounded-xl flex items-center justify-center space-x-2 border border-gray-700 transition">
                    <i class="fa-solid fa-circle-play text-white text-sm"></i>
                    <span>Trailer</span>
                </button>
            </div>

            <p id="detailOverview" class="text-xs sm:text-sm text-gray-300 leading-relaxed"></p>

            <div class="space-y-1 text-xs border-t border-b border-gray-800 py-3">
                <div class="flex"><span class="text-gray-500 uppercase font-bold w-28">DIRECTOR</span><span id="detailDirector" class="text-gray-200 font-semibold">N/A</span></div>
                <div class="flex"><span class="text-gray-500 uppercase font-bold w-28">WRITTEN BY</span><span id="detailWriter" class="text-gray-200 font-semibold">N/A</span></div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase text-gray-400 tracking-wider">TOP CAST</h3>
                <div id="detailCastContainer" class="flex items-center space-x-4 overflow-x-auto hide-scrollbar py-1"></div>
            </div>

            <div class="space-y-3">
                <h3 id="directorMoviesTitle" class="text-xs font-bold uppercase text-gray-400 tracking-wider">FROM DIRECTOR</h3>
                <div id="directorMoviesGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase text-gray-400 tracking-wider">YOU MAY ALSO LIKE</h3>
                <div id="detailRecommendationsGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
            </div>
        </div>
    </div>

    <!-- Actor Profile Modal (Exact like Image 2) -->
    <div id="actorModal" class="hidden fixed inset-0 bg-[#070b12] z-50 overflow-y-auto hide-scrollbar p-4 sm:p-6">
        <div class="max-w-5xl mx-auto space-y-6">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <button onclick="document.getElementById('actorModal').classList.add('hidden')" class="bg-gray-800/80 p-2 rounded-full text-white hover:bg-gray-700"><i class="fa-solid fa-arrow-left"></i></button>
                <h3 class="text-sm font-bold text-gray-300 uppercase">Actor Profile</h3>
                <div class="w-8"></div>
            </div>

            <div class="flex flex-col items-center text-center space-y-3">
                <img id="actorModalAvatar" src="" class="w-28 h-28 sm:w-36 sm:h-36 rounded-full object-cover border-2 border-cyan-500 shadow-2xl">
                <h2 id="actorModalName" class="text-xl sm:text-2xl font-extrabold text-white"></h2>
                <p id="actorModalBio" class="text-xs text-gray-400 max-w-2xl leading-relaxed line-clamp-4"></p>
                <div class="flex flex-wrap justify-center gap-4 text-xs text-gray-400 font-bold bg-[#111622] px-4 py-2 rounded-xl border border-gray-800">
                    <span>Born: <strong id="actorModalBirthday" class="text-white">N/A</strong></span>
                    <span>Place: <strong id="actorModalPlace" class="text-white">N/A</strong></span>
                    <span>Movies: <strong id="actorMoviesCount" class="text-cyan-400">0</strong></span>
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <h4 class="text-xs font-bold uppercase text-gray-400 tracking-wider">Filmography & More Movies</h4>
                <div id="actorFilmographyGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
            </div>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
        <div class="bg-[#0e131d] px-4 py-2 flex items-center justify-between border-b border-gray-800">
            <span id="playerTitle" class="text-xs font-bold text-white truncate max-w-md">Playing Media</span>
            <button onclick="document.getElementById('playerModal').classList.add('hidden'); document.getElementById('videoIframe').src='';" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex-1 w-full h-full bg-black">
            <iframe id="videoIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Stream Links Modal -->
    <div id="streamLinksModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-[#111622] border border-gray-800 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl relative">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h3 class="text-sm font-bold text-white">Select Server / Source</h3>
                <button onclick="document.getElementById('streamLinksModal').classList.add('hidden')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="streamLinksContainer" class="space-y-2 max-h-80 overflow-y-auto hide-scrollbar text-xs"></div>
        </div>
    </div>

    <!-- Filter Modal (Filter Catalog) -->
    <div id="filterModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#12141c] border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative flex flex-col space-y-5">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                <div class="flex items-center space-x-2 text-cyan-400 font-bold text-lg">
                    <i class="fa-solid fa-filter"></i>
                    <span>FILTER CATALOG</span>
                </div>
                <button onclick="closeFilterModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex flex-col space-y-4 text-xs">
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Network</label>
                    <select id="filterNetworkSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Type</label>
                    <select id="filterTypeSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none">
                        <option value="movie">Movies</option>
                        <option value="tv">TV Shows</option>
                    </select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Genre</label>
                    <select id="filterGenreSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Year</label>
                    <select id="filterYearSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Sort By</label>
                    <select id="filterSortSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none">
                        <option value="popularity.desc">Popularity</option>
                        <option value="vote_average.desc">Rating</option>
                        <option value="release_date.desc">Latest</option>
                    </select>
                </div>
            </div>

            <button onclick="applyFiltersFromModal()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg uppercase tracking-wide text-xs">
                Apply Filters
            </button>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        const API_KEY = 'cd193c4897ae4e519cca3734ef116a7e';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';
        const PLACEHOLDER_IMG = 'https://placehold.co/400x600/111622/ffffff?text=No+Image';

        const NETWORKS = [
            { id: 'all', name: 'All' },
            { id: 213, name: 'Netflix', svg: `<span class="text-red-600 font-bold text-xl uppercase">NETFLIX</span>` },
            { id: 2739, name: 'Disney+', svg: `<span class="text-cyan-500 font-bold italic text-lg">Disney+</span>` },
            { id: 119, name: 'Prime Video', svg: `<span class="text-black font-semibold text-sm flex items-center space-x-1"><span>prime</span><span class="text-cyan-500 font-bold">video</span></span>` },
            { id: 2552, name: 'Apple TV+', svg: `<span class="text-black font-semibold text-base flex items-center"><i class="fa-brands fa-apple mr-1 text-xl"></i>tv+</span>` },
            { id: 67, name: 'HBO Max', svg: `<span class="text-purple-600 font-bold text-base tracking-widest uppercase">HBOMAX</span>` },
            { id: 49, name: 'Hulu', svg: `<span class="text-emerald-500 font-bold text-lg">hulu</span>` }
        ];

        const GENRES = [
            { id: 'all', name: 'All Genres' },
            { id: 28, name: 'Action' }, { id: 12, name: 'Adventure' }, { id: 16, name: 'Animation' },
            { id: 35, name: 'Comedy' }, { id: 80, name: 'Crime' }, { id: 18, name: 'Drama' },
            { id: 27, name: 'Horror' }, { id: 9648, name: 'Mystery' }, { id: 10749, name: 'Romance' },
            { id: 878, name: 'Science Fiction' }, { id: 53, name: 'Thriller' }
        ];

        let currentState = { type: 'movie', category: 'trending', network: 'all', genre: 'all', year: 'all', sort: 'popularity.desc', query: '', searchTab: 'movie', page: 1 };
        let cachedItems = [];
        let favorites = JSON.parse(localStorage.getItem('fv_favorites') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            setupFilterDropdowns();
            setupEventListeners();
            switchCategory('trending');
        });

        function showToast(msg) {
            const t = document.getElementById('toastNotification');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            setTimeout(() => t.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]'), 3000);
        }

        function setupFilterDropdowns() {
            document.getElementById('networkChipsContainer').innerHTML = NETWORKS.filter(n => n.id !== 'all').map(n => `
                <button onclick="selectNetwork('${n.id}')" class="h-10 px-4 rounded-xl bg-white border border-gray-200 hover:border-cyan-500 transition shrink-0 flex items-center justify-center shadow-md">
                    ${n.svg}
                </button>
            `).join('');

            document.getElementById('filterNetworkSelect').innerHTML = NETWORKS.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
            document.getElementById('filterGenreSelect').innerHTML = GENRES.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            
            let yrs = '<option value="all">All Years</option>';
            for (let y = 2026; y >= 1970; y--) yrs += `<option value="${y}">${y}</option>`;
            document.getElementById('filterYearSelect').innerHTML = yrs;
        }

        function selectNetwork(id) {
            currentState.network = id;
            currentState.page = 1;
            fetchContent(true);
        }

        function switchCategory(cat) {
            currentState.category = cat;
            currentState.page = 1;
            ['trending', 'theater', 'popular'].forEach(c => {
                const btn = document.getElementById(`tab${c.charAt(0).toUpperCase() + c.slice(1)}`);
                if (btn) btn.className = c === cat ? 'py-3 text-white border-b-2 border-cyan-400 transition whitespace-nowrap' : 'py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap';
            });
            document.getElementById('pageTitle').innerText = `${currentState.type.toUpperCase()}S: ${cat.toUpperCase()}`;
            fetchContent(true);
        }

        function switchContentType(type) {
            currentState.type = type;
            currentState.page = 1;
            document.getElementById('pageTitle').innerText = `${type.toUpperCase()}S: ${currentState.category.toUpperCase()}`;
            fetchContent(true);
        }

        function setupEventListeners() {
            document.getElementById('searchToggleBtn').addEventListener('click', () => {
                document.getElementById('searchBarContainer').classList.toggle('hidden');
            });
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentState.query = e.target.value.trim();
                currentState.page = 1;
                fetchContent(true);
            });
            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                currentState.query = '';
                fetchContent(true);
            });
            document.getElementById('closeDetailModalBtn').addEventListener('click', () => document.getElementById('movieDetailModal').classList.add('hidden'));
        }

        function openFilterModal() { document.getElementById('filterModal').classList.remove('hidden'); }
        function closeFilterModal() { document.getElementById('filterModal').classList.add('hidden'); }
        function applyFiltersFromModal() {
            currentState.network = document.getElementById('filterNetworkSelect').value;
            currentState.type = document.getElementById('filterTypeSelect').value;
            currentState.genre = document.getElementById('filterGenreSelect').value;
            currentState.year = document.getElementById('filterYearSelect').value;
            currentState.sort = document.getElementById('filterSortSelect').value;
            closeFilterModal();
            fetchContent(true);
        }

        async function fetchContent(reset = false) {
            const grid = document.getElementById('movieGrid');
            if (reset) grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 text-xs">Loading content...</div>`;

            let url = `${BASE_URL}/trending/${currentState.type}/day?api_key=${API_KEY}&page=${currentState.page}`;
            if (currentState.category === 'theater') {
                url = currentState.type === 'movie' ? `${BASE_URL}/movie/now_playing?api_key=${API_KEY}&page=${currentState.page}` : `${BASE_URL}/tv/on_the_air?api_key=${API_KEY}&page=${currentState.page}`;
            } else if (currentState.category === 'popular') {
                url = `${BASE_URL}/${currentState.type}/popular?api_key=${API_KEY}&page=${currentState.page}`;
            }

            if (currentState.query) {
                url = `${BASE_URL}/search/${currentState.type}?api_key=${API_KEY}&query=${encodeURIComponent(currentState.query)}&page=${currentState.page}`;
            } else if (currentState.network !== 'all' || currentState.genre !== 'all' || currentState.year !== 'all') {
                url = `${BASE_URL}/discover/${currentState.type}?api_key=${API_KEY}&sort_by=${currentState.sort}&page=${currentState.page}`;
                if (currentState.network !== 'all') url += `&with_companies=${currentState.network}`;
                if (currentState.genre !== 'all') url += `&with_genres=${currentState.genre}`;
                if (currentState.year !== 'all') url += currentState.type === 'tv' ? `&first_air_date_year=${currentState.year}` : `&primary_release_year=${currentState.year}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                cachedItems = reset ? (data.results || []) : [...cachedItems, ...(data.results || [])];
                renderGrid(cachedItems);
            } catch (e) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500 text-xs">Error loading data.</div>`;
            }
        }

        function handleLoadMore() {
            currentState.page++;
            fetchContent(false);
        }

        function renderGrid(items) {
            const grid = document.getElementById('movieGrid');
            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 text-xs">No items found.</div>`;
                return;
            }
            grid.innerHTML = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const year = (item.release_date || item.first_air_date || '2026').split('-')[0];
                const poster = item.poster_path ? `${IMAGE_URL}${item.poster_path}` : PLACEHOLDER_IMG;
                const itemType = item.media_type || currentState.type;

                return `
                    <div onclick="openMovieDetails(${item.id}, '${itemType}')" class="poster-card bg-[#111622] border border-gray-800/80 rounded-xl overflow-hidden flex flex-col cursor-pointer">
                        <div class="aspect-[2/3] w-full bg-gray-900 relative">
                            <img src="${poster}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                        <div class="p-2 flex flex-col justify-between flex-1">
                            <h3 class="text-xs font-bold text-gray-100 truncate leading-tight">${title}</h3>
                            <span class="text-[10px] text-gray-400 mt-1">${year}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openMovieDetails(id, type) {
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&append_to_response=credits,recommendations,videos`);
                const data = await res.json();

                document.getElementById('detailBackdrop').src = data.backdrop_path ? BACKDROP_URL + data.backdrop_path : PLACEHOLDER_IMG;
                document.getElementById('detailTitle').innerText = data.title || data.name;
                document.getElementById('detailYear').innerText = (data.release_date || data.first_air_date || '2026').split('-')[0];
                document.getElementById('detailGenres').innerText = (data.genres || []).map(g => g.name).join(', ');
                document.getElementById('detailOverview').innerText = data.overview || 'No description available.';

                const director = (data.credits?.crew || []).find(c => c.job === 'Director');
                document.getElementById('detailDirector').innerText = director ? director.name : 'N/A';
                document.getElementById('directorMoviesTitle').innerText = director ? `FROM ${director.name.toUpperCase()}` : 'FROM DIRECTOR';

                // Cast
                const castContainer = document.getElementById('detailCastContainer');
                castContainer.innerHTML = (data.credits?.cast || []).slice(0, 15).map(actor => `
                    <div onclick="openActorProfile(${actor.id})" class="flex flex-col items-center shrink-0 w-20 text-center cursor-pointer group">
                        <img src="${actor.profile_path ? IMAGE_URL + actor.profile_path : PLACEHOLDER_IMG}" class="w-14 h-14 rounded-full object-cover border border-gray-700 shadow group-hover:border-cyan-400 transition">
                        <span class="text-[10px] font-bold text-white mt-1 truncate w-full">${actor.name}</span>
                        <span class="text-[9px] text-gray-400 truncate w-full">${actor.character || ''}</span>
                    </div>
                `).join('');

                // Director's other works / Recommendations
                if (director) {
                    const dirRes = await fetch(`${BASE_URL}/person/${director.id}/movie_credits?api_key=${API_KEY}`);
                    const dirData = await dirRes.json();
                    const dirGrid = document.getElementById('directorMoviesGrid');
                    dirGrid.innerHTML = (dirData.crew || []).filter(w => w.id !== data.id).slice(0, 6).map(w => `
                        <div onclick="openMovieDetails(${w.id}, 'movie')" class="bg-[#111622] border border-gray-800 rounded-lg overflow-hidden cursor-pointer">
                            <div class="aspect-[2/3] w-full bg-gray-900"><img src="${w.poster_path ? IMAGE_URL + w.poster_path : PLACEHOLDER_IMG}" class="w-full h-full object-cover"></div>
                            <div class="p-1"><p class="text-[10px] font-bold text-white truncate">${w.title}</p></div>
                        </div>
                    `).join('');
                }

                const recsGrid = document.getElementById('detailRecommendationsGrid');
                recsGrid.innerHTML = (data.recommendations?.results || []).slice(0, 6).map(rec => `
                    <div onclick="openMovieDetails(${rec.id}, '${type}')" class="bg-[#111622] border border-gray-800 rounded-lg overflow-hidden cursor-pointer">
                        <div class="aspect-[2/3] w-full bg-gray-900"><img src="${rec.poster_path ? IMAGE_URL + rec.poster_path : PLACEHOLDER_IMG}" class="w-full h-full object-cover"></div>
                        <div class="p-1"><p class="text-[10px] font-bold text-white truncate">${rec.title || rec.name}</p></div>
                    </div>
                `).join('');

                document.getElementById('detailPlayBtn').onclick = () => openStreamLinks(data.id, type);
                document.getElementById('movieDetailModal').classList.remove('hidden');
            } catch (e) {}
        }

        async function openActorProfile(personId) {
            const modal = document.getElementById('actorModal');
            document.getElementById('actorModalAvatar').src = PLACEHOLDER_IMG;
            document.getElementById('actorModalName').innerText = 'Loading...';
            document.getElementById('actorModalBio').innerText = '';
            document.getElementById('actorFilmographyGrid').innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 text-xs">Loading works...</div>';
            modal.classList.remove('hidden');

            try {
                const [pRes, cRes] = await Promise.all([
                    fetch(`${BASE_URL}/person/${personId}?api_key=${API_KEY}`),
                    fetch(`${BASE_URL}/person/${personId}/combined_credits?api_key=${API_KEY}`)
                ]);
                const person = await pRes.json();
                const credits = await cRes.json();

                document.getElementById('actorModalAvatar').src = person.profile_path ? `${IMAGE_URL}${person.profile_path}` : PLACEHOLDER_IMG;
                document.getElementById('actorModalName').innerText = person.name || 'Unknown';
                document.getElementById('actorModalBio').innerText = person.biography || 'No biography available.';
                document.getElementById('actorModalBirthday').innerText = person.birthday || 'N/A';
                document.getElementById('actorModalPlace').innerText = person.place_of_birth || 'N/A';

                const works = (credits.cast || []).sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
                document.getElementById('actorMoviesCount').innerText = works.length;

                document.getElementById('actorFilmographyGrid').innerHTML = works.slice(0, 12).map(w => `
                    <div onclick="document.getElementById('actorModal').classList.add('hidden'); openMovieDetails(${w.id}, '${w.media_type || 'movie'}')" class="bg-[#111622] border border-gray-800 rounded-lg overflow-hidden cursor-pointer">
                        <div class="aspect-[2/3] w-full bg-gray-900"><img src="${w.poster_path ? IMAGE_URL + w.poster_path : PLACEHOLDER_IMG}" class="w-full h-full object-cover"></div>
                        <div class="p-1"><p class="text-[10px] font-bold text-white truncate">${w.title || w.name}</p></div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function openStreamLinks(id, type) {
            const modal = document.getElementById('streamLinksModal');
            const container = document.getElementById('streamLinksContainer');
            const servers = [
                { name: 'FLIXVISION SERVER 1', url: `https://vidsrc.me/embed/movie?tmdb=${id}` },
                { name: 'VIDLINK PRO', url: `https://vidlink.pro/movie/${id}` }
            ];
            container.innerHTML = servers.map(s => `
                <div onclick="playStream('${s.url}', '${s.name}')" class="p-3 bg-[#070b12] hover:bg-cyan-600/20 border border-gray-800 rounded-xl flex items-center justify-between cursor-pointer transition">
                    <span class="font-bold text-gray-200">${s.name}</span>
                    <i class="fa-solid fa-play text-cyan-400 text-xs"></i>
                </div>
            `).join('');
            modal.classList.remove('hidden');
        }

        function playStream(url, name) {
            document.getElementById('streamLinksModal').classList.add('hidden');
            document.getElementById('playerTitle').innerText = name;
            document.getElementById('videoIframe').src = url;
            document.getElementById('playerModal').classList.remove('hidden');
        }
    </script>
</body>
</html>
