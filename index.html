                        </div>
                        <div class="card-body">
                          <div class="card-title">${escapeHtml(part.title)}</div>
                          <div class="card-sub"><span>${escapeHtml(partYear)}</span></div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </section>
            ` : ''}
          </div>
        `;

        if (item.media_type === 'tv') {
          renderEpisodesSectionOnly();
        }
        if (!state.modal.streamActive) {
          renderPlayerPlaceholder();
        }
      }

      function renderEpisodesSectionOnly() {
        const panel = document.getElementById('episodes-panel');
        if (!panel) return;
        const { seasons, selectedSeason, selectedEpisode, episodes, episodesLoading } = state.modal;

        const currentIdx = episodes.findIndex((e) => e.episode_number === selectedEpisode);
        const hasPrev = currentIdx > 0;
        const hasNext = currentIdx >= 0 && currentIdx < episodes.length - 1;

        panel.innerHTML = `
          <div class="episodes-toolbar">
            <div class="episodes-selects">
              <select id="season-select" class="styled-select" aria-label="Select Season">
                ${seasons.map((s) => `
                  <option value="${s.season_number}" ${s.season_number === selectedSeason ? 'selected' : ''}>
                    ${escapeHtml(s.name || `Season ${s.season_number}`)} (${s.episode_count} Eps)
                  </option>
                `).join('')}
              </select>

              <select id="episode-select" class="styled-select" aria-label="Select Episode" ${episodesLoading || !episodes.length ? 'disabled' : ''}>
                ${episodes.length
                  ? episodes.map((ep) => `
                      <option value="${ep.episode_number}" ${ep.episode_number === selectedEpisode ? 'selected' : ''}>
                        E${ep.episode_number} — ${escapeHtml(ep.name || `Episode ${ep.episode_number}`)}
                      </option>
                    `).join('')
                  : `<option value="1">Episode 1</option>`
                }
              </select>
            </div>

            <div class="episode-nav-btns">
              <button type="button" class="btn-secondary btn-sm" id="prev-ep-btn" ${hasPrev ? '' : 'disabled'}>‹ Prev</button>
              <button type="button" class="btn-secondary btn-sm" id="next-ep-btn" ${hasNext ? '' : 'disabled'}>Next ›</button>
            </div>
          </div>

          ${episodesLoading
            ? `<div class="episodes-list">${Array.from({ length: 4 }).map(() => `<div class="ep-card skeleton-shimmer" style="height:64px;"></div>`).join('')}</div>`
            : episodes.length
              ? `<div class="episodes-list" id="episodes-list-scroll">
                  ${episodes.map((ep) => {
                    const active = ep.episode_number === selectedEpisode;
                    const stillUrl = ep.still_path ? `${IMG_BASE}/w300${ep.still_path}` : '';
                    return `
                      <button
                        type="button"
                        class="ep-card ${active ? 'active' : ''}"
                        data-select-episode="${ep.episode_number}"
                      >
                        ${stillUrl
                          ? `<img class="ep-thumb" src="${stillUrl}" alt="" loading="lazy" />`
                          : `<div class="ep-thumb poster-fallback" style="font-size:0.7rem;">E${ep.episode_number}</div>`
                        }
                        <div class="ep-info">
                          <span class="ep-num">Episode ${ep.episode_number}</span>
                          <span class="ep-title">${escapeHtml(ep.name || `Episode ${ep.episode_number}`)}</span>
                          <span class="ep-runtime">${ep.runtime ? `${ep.runtime}m` : (ep.air_date || '')}</span>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>`
              : `<p class="card-sub">No detailed episode list available for this season; direct streaming still works for Episode 1.</p>`
          }
        `;
      }

      function renderPlayerPlaceholder() {
        const slot = document.getElementById('player-slot');
        if (!slot) return;
        const srv = getServerById(state.modal.selectedServerId);
        const { item, selectedSeason, selectedEpisode } = state.modal;
        const subText = item.media_type === 'tv'
          ? `Season ${selectedSeason} • Episode ${selectedEpisode} on ${srv.name}`
          : `${item.title} on ${srv.name}`;

        slot.innerHTML = `
          <div class="player-placeholder">
            <button type="button" id="manual-play-btn" class="btn-primary" style="min-height:52px;padding:12px 26px;font-size:1rem;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
              Load Stream Now
            </button>
            <div style="font-size:0.86rem;color:var(--text-secondary);">${escapeHtml(subText)}</div>
          </div>
        `;
      }

      function mountStreamPlayer() {
        const slot = document.getElementById('player-slot');
        if (!slot || !state.modal.item) return;

        const oldIframe = slot.querySelector('iframe');
        if (oldIframe) {
          try { oldIframe.src = 'about:blank'; } catch (_) {}
          oldIframe.removeAttribute('src');
        }
        slot.innerHTML = '';

        state.modal.streamActive = true;
        const { item, selectedSeason, selectedEpisode, selectedServerId } = state.modal;
        const server = getServerById(selectedServerId);
        const streamUrl = item.media_type === 'tv'
          ? server.tvUrl(item.id, selectedSeason, selectedEpisode)
          : server.movieUrl(item.id);

        const iframe = document.createElement('iframe');
        iframe.className = 'player-iframe';
        iframe.src = streamUrl;
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('webkitallowfullscreen', '');
        iframe.setAttribute('mozallowfullscreen', '');
        iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture; encrypted-media');
        iframe.setAttribute('referrerpolicy', 'origin');
        iframe.setAttribute('title', `${item.title} Stream Player`);
        slot.appendChild(iframe);

        const epIndicator = document.getElementById('player-ep-indicator');
        if (epIndicator && item.media_type === 'tv') {
          epIndicator.textContent = `S${selectedSeason} • E${selectedEpisode}`;
        }

        document.querySelectorAll('.server-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.serverId === server.id);
        });

        recordWatchHistory(item, selectedSeason, selectedEpisode, server.id);
      }

      function togglePlayerFullscreen() {
        const stage = document.getElementById('player-stage');
        if (!stage) return;

        const isPseudo = stage.classList.contains('is-pseudo-fullscreen');
        const isNative = Boolean(document.fullscreenElement || document.webkitFullscreenElement);

        if (isNative || isPseudo) {
          exitPlayerFullscreenIfActive();
          return;
        }

        const reqFs = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (typeof reqFs === 'function') {
          try {
            const p = reqFs.call(stage);
            if (p && typeof p.catch === 'function') {
              p.catch(() => stage.classList.add('is-pseudo-fullscreen'));
            }
          } catch (_) {
            stage.classList.add('is-pseudo-fullscreen');
          }
        } else {
          stage.classList.add('is-pseudo-fullscreen');
        }
      }

      function openSettingsModal() {
        const autoToggle = document.getElementById('setting-autoplay-toggle');
        const serverSelect = document.getElementById('setting-default-server');
        const layoutSelect = document.getElementById('setting-layout-mode');

        autoToggle.setAttribute('aria-checked', String(state.settings.autoPlay));
        serverSelect.innerHTML = STREAM_SERVERS.map((s) => `
          <option value="${s.id}" ${s.id === state.settings.defaultServer ? 'selected' : ''}>
            ${escapeHtml(s.name)} (${escapeHtml(s.badge)})
          </option>
        `).join('');
        layoutSelect.value = state.settings.layoutMode;

        refreshSettingsCounts();
        document.body.classList.add('modal-open');
        settingsBackdrop.classList.add('open');
      }

      function closeSettingsModal() {
        settingsBackdrop.classList.remove('open');
        if (!detailBackdrop.classList.contains('open')) {
          document.body.classList.remove('modal-open');
        }
      }

      function refreshSettingsCounts() {
        document.getElementById('history-count-label').textContent = `${state.history.length} items`;
        document.getElementById('searches-count-label').textContent = `${state.recentSearches.length} items`;
        document.getElementById('saved-count-label').textContent = `${state.saved.length} items`;
      }

      function saveSettings() {
        writeStorage(STORAGE_KEYS.settings, state.settings);
      }

      function switchTab(nextTab) {
        if (!['home', 'movies', 'series', 'anime', 'saved', 'history'].includes(nextTab)) return;
        state.tab = nextTab;
        state.genreId = '';
        state.sort = 'popular';
        state.page = 1;

        document.querySelectorAll('[data-tab]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === nextTab);
        });
        document.getElementById('mobile-history-btn').classList.toggle('active', nextTab === 'history');

        window.scrollTo({ top: 0, behavior: 'instant' });
        loadCurrentView();
      }

      document.getElementById('brand-home-btn').addEventListener('click', () => {
        if (state.searchQuery) {
          state.searchQuery = '';
          searchInput.value = '';
          searchClearBtn.classList.remove('visible');
        }
        switchTab('home');
      });

      document.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      document.getElementById('mobile-history-btn').addEventListener('click', () => switchTab('history'));
      document.getElementById('open-settings-btn').addEventListener('click', openSettingsModal);
      document.getElementById('settings-close-btn').addEventListener('click', closeSettingsModal);
      document.getElementById('detail-close-btn').addEventListener('click', closeDetailModal);
      document.getElementById('error-retry-btn').addEventListener('click', () => loadCurrentView());

      detailBackdrop.addEventListener('click', (e) => {
        if (e.target === detailBackdrop) closeDetailModal();
      });

      settingsBackdrop.addEventListener('click', (e) => {
        if (e.target === settingsBackdrop) closeSettingsModal();
      });

      searchInput.addEventListener('input', (e) => {
        const val = e.target.value;
        state.searchQuery = val;
        searchClearBtn.classList.toggle('visible', val.trim().length > 0);
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          if (val.trim().length >= 2) addRecentSearch(val.trim());
          loadCurrentView();
        }, 340);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && searchInput.value.trim()) {
          clearTimeout(searchDebounceTimer);
          addRecentSearch(searchInput.value.trim());
          loadCurrentView();
        }
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.searchQuery = '';
        searchClearBtn.classList.remove('visible');
        searchInput.focus();
        loadCurrentView();
      });

      recentSearchesBar.addEventListener('click', (e) => {
        const runBtn = e.target.closest('[data-recent-query]');
        if (runBtn) {
          const q = runBtn.dataset.recentQuery;
          searchInput.value = q;
          state.searchQuery = q;
          searchClearBtn.classList.add('visible');
          loadCurrentView();
          return;
        }
        const remBtn = e.target.closest('[data-remove-query]');
        if (remBtn) {
          const q = remBtn.dataset.removeQuery;
          state.recentSearches = state.recentSearches.filter((x) => x !== q);
          writeStorage(STORAGE_KEYS.searches, state.recentSearches);
          renderRecentSearches();
        }
      });

      mainContentEl.addEventListener('click', (e) => {
        const removeHistoryBtn = e.target.closest('[data-remove-history-id]');
        if (removeHistoryBtn) {
          e.stopPropagation();
          const id = Number(removeHistoryBtn.dataset.removeHistoryId);
          const type = removeHistoryBtn.dataset.removeHistoryType;
          state.history = state.history.filter((h) => !(h.id === id && h.media_type === type));
          writeStorage(STORAGE_KEYS.history, state.history);
          renderMain();
          showToast('Removed from Continue Watching');
          return;
        }

        const saveBtn = e.target.closest('[data-save-id]');
        if (saveBtn) {
          e.stopPropagation();
          const id = Number(saveBtn.dataset.saveId);
          const type = saveBtn.dataset.saveType;
          const item = findItemContext(id, type);
          if (item) toggleSavedItem(item);
          return;
        }

        const jumpBtn = e.target.closest('[data-jump-tab]');
        if (jumpBtn) {
          switchTab(jumpBtn.dataset.jumpTab);
          return;
        }

        const openEl = e.target.closest('[data-open-id]');
        if (openEl) {
          openDetailModal(openEl.dataset.openId, openEl.dataset.openType, {
            isAnime: openEl.dataset.isAnime === '1',
            season: openEl.dataset.resumeSeason,
            episode: openEl.dataset.resumeEpisode,
            serverId: openEl.dataset.resumeServer
          });
          return;
        }

        const genreChip = e.target.closest('[data-genre]');
        if (genreChip) {
          state.genreId = genreChip.dataset.genre;
          loadCurrentView();
          return;
        }

        const subBtn = e.target.closest('[data-anime-sub]');
        if (subBtn) {
          state.animeSubtype = subBtn.dataset.animeSub;
          loadCurrentView();
          return;
        }

        if (e.target.id === 'load-more-btn') {
          state.page += 1;
          loadCurrentView({ append: true });
          return;
        }

        if (e.target.id === 'empty-clear-search-btn') {
          searchClearBtn.click();
          return;
        }

        if (e.target.id === 'reset-filters-btn') {
          state.genreId = '';
          state.sort = 'popular';
          state.animeSubtype = 'all';
          loadCurrentView();
        }
      });

      mainContentEl.addEventListener('change', (e) => {
        if (e.target.id === 'sort-select') {
          state.sort = e.target.value;
          loadCurrentView();
        } else if (e.target.id === 'genre-select') {
          state.genreId = e.target.value;
          loadCurrentView();
        }
      });

      mainContentEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const openEl = e.target.closest('[data-open-id]');
          if (openEl && !e.target.closest('button')) {
            e.preventDefault();
            openEl.click();
          }
        }
      });

      detailContentEl.addEventListener('click', (e) => {
        const saveBtn = e.target.closest('[data-save-id]');
        if (saveBtn && state.modal.item) {
          toggleSavedItem(state.modal.item);
          return;
        }

        const srvBtn = e.target.closest('[data-server-id]');
        if (srvBtn) {
          state.modal.selectedServerId = srvBtn.dataset.serverId;
          mountStreamPlayer();
          return;
        }

        if (e.target.closest('#manual-play-btn') || e.target.closest('#player-reload-btn')) {
          mountStreamPlayer();
          return;
        }

        if (e.target.closest('#player-fullscreen-btn') || e.target.closest('#player-fs-exit-btn')) {
          togglePlayerFullscreen();
          return;
        }

        const epCard = e.target.closest('[data-select-episode]');
        if (epCard) {
          state.modal.selectedEpisode = Number(epCard.dataset.selectEpisode);
          const epSel = document.getElementById('episode-select');
          if (epSel) epSel.value = String(state.modal.selectedEpisode);
          renderEpisodesSectionOnly();
          mountStreamPlayer();
          return;
        }

        if (e.target.id === 'prev-ep-btn' || e.target.id === 'next-ep-btn') {
          const eps = state.modal.episodes;
          const idx = eps.findIndex((x) => x.episode_number === state.modal.selectedEpisode);
          const nextIdx = e.target.id === 'prev-ep-btn' ? idx - 1 : idx + 1;
          if (nextIdx >= 0 && nextIdx < eps.length) {
            state.modal.selectedEpisode = eps[nextIdx].episode_number;
            renderEpisodesSectionOnly();
            mountStreamPlayer();
          }
          return;
        }

        const colPart = e.target.closest('.collection-card[data-open-id]');
        if (colPart) {
          openDetailModal(colPart.dataset.openId, 'movie', {
            isAnime: colPart.dataset.isAnime === '1',
            forcePlay: state.modal.streamActive
          });
        }
      });

      detailContentEl.addEventListener('change', async (e) => {
        if (e.target.id === 'season-select') {
          const nextSeason = Number(e.target.value);
          state.modal.selectedSeason = nextSeason;
          await loadSeasonEpisodes(state.modal.item.id, nextSeason, true);
          state.modal.selectedEpisode = state.modal.episodes[0]?.episode_number || 1;
          renderEpisodesSectionOnly();
          mountStreamPlayer();
        } else if (e.target.id === 'episode-select') {
          state.modal.selectedEpisode = Number(e.target.value);
          renderEpisodesSectionOnly();
          mountStreamPlayer();
        }
      });

      document.getElementById('setting-autoplay-toggle').addEventListener('click', (e) => {
        const btn = e.currentTarget;
        state.settings.autoPlay = !state.settings.autoPlay;
        btn.setAttribute('aria-checked', String(state.settings.autoPlay));
        saveSettings();
        showToast(`Auto-Play ${state.settings.autoPlay ? 'Enabled' : 'Disabled'}`);
      });

      document.getElementById('setting-default-server').addEventListener('change', (e) => {
        state.settings.defaultServer = e.target.value;
        saveSettings();
        showToast(`Default server: ${getServerById(e.target.value).name}`);
      });

      document.getElementById('setting-layout-mode').addEventListener('change', (e) => {
        state.settings.layoutMode = e.target.value;
        saveSettings();
        renderMain();
        showToast(`Layout: ${e.target.value === 'single' ? 'Single-Card View' : 'Standard Grid'}`);
      });

      document.getElementById('clear-history-btn').addEventListener('click', () => {
        state.history = [];
        writeStorage(STORAGE_KEYS.history, []);
        refreshSettingsCounts();
        if (state.tab === 'home' || state.tab === 'history') renderMain();
        showToast('Watch history cleared');
      });

      document.getElementById('clear-searches-btn').addEventListener('click', () => {
        state.recentSearches = [];
        writeStorage(STORAGE_KEYS.searches, []);
        renderRecentSearches();
        refreshSettingsCounts();
        showToast('Recent searches cleared');
      });

      document.getElementById('clear-saved-btn').addEventListener('click', () => {
        state.saved = [];
        writeStorage(STORAGE_KEYS.saved, []);
        updateSavedBadges();
        refreshSettingsCounts();
        renderMain();
        showToast('Saved items cleared');
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const stage = document.getElementById('player-stage');
          if (stage && (stage.classList.contains('is-pseudo-fullscreen') || document.fullscreenElement)) {
            exitPlayerFullscreenIfActive();
            return;
          }
          if (settingsBackdrop.classList.contains('open')) {
            closeSettingsModal();
            return;
          }
          if (detailBackdrop.classList.contains('open')) {
            closeDetailModal();
          }
        }
      });

      window.__flixCloseActiveOverlay = () => {
        const stage = document.getElementById('player-stage');
        if (stage && (stage.classList.contains('is-pseudo-fullscreen') || document.fullscreenElement)) {
          exitPlayerFullscreenIfActive();
          return true;
        }
        if (settingsBackdrop.classList.contains('open')) {
          closeSettingsModal();
          return true;
        }
        if (detailBackdrop.classList.contains('open')) {
          closeDetailModal();
          return true;
        }
        if (state.searchQuery.trim()) {
          searchClearBtn.click();
          return true;
        }
        if (state.tab !== 'home') {
          switchTab('home');
          return true;
        }
        return false;
      };

      updateSavedBadges();
      renderRecentSearches();
      loadCurrentView();
    })();
  </script>
</body>
</html>
