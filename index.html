<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flix Vision Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <style>
        :root {
            --bg-main: #070b12;
            --bg-card: #111622;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .poster-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col overflow-x-hidden bg-gradient-to-b from-[#180404] via-[#070b12] to-[#070b12]">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-[#0e131d]/95 backdrop-blur-md border-b border-gray-800/40 px-4 py-3.5 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3.5 min-w-0 flex-1 mr-2">
            <button id="openSidebarBtn" class="text-gray-200 hover:text-white p-1 transition shrink-0" title="Menu">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="15" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="13" y2="18"></line>
                </svg>
            </button>
            <h1 id="pageTitle" class="text-xs sm:text-base font-extrabold text-white tracking-wider truncate uppercase">
                MOVIES: TRENDING
            </h1>
        </div>

        <div class="flex items-center space-x-4 text-gray-200 text-xl shrink-0">
            <button id="castBtn" class="hover:text-cyan-400 transition p-1" title="Cast"><i class="fa-solid fa-cast"></i></button>
            <button id="searchToggleBtn" class="hover:text-cyan-400 transition p-1" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button onclick="openFilterModal()" class="hover:text-cyan-400 transition p-1" title="Filter"><i class="fa-solid fa-filter"></i></button>
        </div>
    </header>

    <!-- Search Overlay Box (Flix Vision Style) -->
    <div id="searchBarContainer" class="hidden bg-[#111723] px-4 py-3 border-b border-gray-800 space-y-3">
        <div class="relative max-w-xl mx-auto flex items-center">
            <input type="text" id="searchInput" placeholder="Movies, TV Shows, People..." 
                class="w-full bg-[#070b12] text-sm text-gray-100 placeholder-gray-500 rounded-lg pl-9 pr-8 py-2 border border-gray-700 focus:outline-none focus:border-cyan-500">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-xs text-gray-400"></i>
            <button id="clearSearchBtn" class="absolute right-3 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex justify-center space-x-3 text-xs font-bold">
            <button onclick="switchSearchTab('movie')" id="searchTabMovie" class="bg-cyan-600 text-white px-4 py-1.5 rounded-full shadow transition">Movies</button>
            <button onclick="switchSearchTab('tv')" id="searchTabTv" class="bg-[#111622] text-gray-400 border border-gray-700 px-4 py-1.5 rounded-full shadow transition">Series</button>
            <button onclick="switchSearchTab('person')" id="searchTabPerson" class="bg-[#111622] text-gray-400 border border-gray-700 px-4 py-1.5 rounded-full shadow transition">People</button>
        </div>
    </div>

    <!-- Category Tabs -->
    <nav class="bg-[#0e131d] px-4 text-xs font-bold uppercase tracking-wider">
        <div class="flex space-x-6 overflow-x-auto hide-scrollbar">
            <button onclick="switchCategory('trending')" id="tabTrending" class="py-3 text-white border-b-2 border-cyan-400 transition whitespace-nowrap">TRENDING</button>
            <button onclick="switchCategory('theater')" id="tabInTheater" class="py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">IN THEATER</button>
            <button onclick="switchCategory('popular')" id="tabPopular" class="py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap">POPULAR</button>
        </div>
    </nav>

    <!-- Network Logos Bar -->
    <section class="bg-[#070b12]/80 py-2.5 px-3 border-b border-gray-800/30">
        <div id="networkChipsContainer" class="flex items-center space-x-3 overflow-x-auto hide-scrollbar"></div>
    </section>

    <!-- Content Grid -->
    <main class="max-w-7xl mx-auto px-3 py-4 space-y-6 flex-1 w-full">
        <div id="customViewHeader" class="hidden flex items-center justify-between border-b border-gray-800 pb-2">
            <h2 id="customViewTitle" class="text-sm font-extrabold text-cyan-400 uppercase tracking-wider">VIEW TITLE</h2>
            <button onclick="resetMainView()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
        </div>

        <div id="movieGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 sm:gap-4"></div>
        
        <div class="text-center py-4">
            <button onclick="handleLoadMore()" id="loadMoreBtn" class="bg-[#111622] hover:bg-cyan-600 hover:text-white border border-gray-800 text-gray-200 font-extrabold px-8 py-3 rounded-xl text-xs transition shadow-xl">
                LOAD MORE CONTENT...
            </button>
        </div>
    </main>

    <!-- Sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/70 z-40 hidden backdrop-blur-sm"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-64 bg-[#0a0d12] border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-300 overflow-y-auto hide-scrollbar text-xs">
        <div class="p-4 space-y-6">
            <div class="space-y-1">
                <button onclick="switchContentType('movie')" class="w-full flex items-center space-x-3 text-gray-200 hover:text-white hover:bg-gray-800/50 px-2 py-2 rounded-lg font-semibold transition">
                    <i class="fa-solid fa-film w-5 text-cyan-400 text-sm"></i><span>Movies</span>
                </button>
                <button onclick="switchContentType('tv')" class="w-full flex items-center space-x-3 text-gray-200 hover:text-white hover:bg-gray-800/50 px-2 py-2 rounded-lg transition">
                    <i class="fa-solid fa-tv w-5 text-cyan-400 text-sm"></i><span>TV Shows</span>
                </button>
            </div>
            <div class="space-y-1 border-t border-gray-800/80 pt-4">
                <span class="text-[10px] uppercase tracking-wider text-gray-500 font-extrabold block mb-1 px-2">ME</span>
                <button onclick="showFavoritesView()" class="w-full flex items-center space-x-3 text-gray-200 hover:text-white hover:bg-gray-800/50 px-2 py-2 rounded-lg transition">
                    <i class="fa-solid fa-heart w-5 text-red-500 text-sm"></i><span>Favorites</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Movie Details Modal -->
    <div id="movieDetailModal" class="hidden fixed inset-0 bg-[#070b12] z-50 overflow-y-auto hide-scrollbar">
        <div class="relative w-full h-72 sm:h-96 bg-gray-900">
            <img id="detailBackdrop" src="" class="w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-t from-[#070b12] via-[#070b12]/40 to-transparent"></div>
            
            <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-10 text-white text-lg">
                <button onclick="document.getElementById('movieDetailModal').classList.add('hidden')" class="bg-black/50 p-2 rounded-full hover:bg-black/70"><i class="fa-solid fa-arrow-left"></i></button>
                <button id="detailFavoriteBtn" class="bg-black/50 p-2.5 rounded-full hover:text-red-500 transition"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="absolute bottom-4 left-4 right-4 space-y-2">
                <h2 id="detailTitle" class="text-2xl sm:text-3xl font-extrabold text-white drop-shadow-md"></h2>
                <div class="flex flex-wrap items-center gap-2 text-xs font-semibold text-gray-300">
                    <span id="detailRatingBadge" class="border border-cyan-500 text-cyan-400 px-1 rounded text-[10px] font-bold">PG-13</span>
                    <span id="detailYear">2026</span><span>•</span>
                    <span id="detailGenres" class="truncate max-w-[180px]"></span>
                </div>
            </div>
        </div>

        <div class="p-4 space-y-6 max-w-5xl mx-auto">
            <div class="flex items-center space-x-3">
                <button id="detailPlayBtn" class="flex-1 bg-white hover:bg-gray-200 text-black font-extrabold py-3 rounded-xl flex items-center justify-center space-x-2 shadow-lg transition">
                    <i class="fa-solid fa-play text-black text-sm"></i>
                    <span>PLAY SOURCE</span>
                </button>
            </div>

            <p id="detailOverview" class="text-xs sm:text-sm text-gray-300 leading-relaxed"></p>

            <div class="space-y-1 text-xs border-t border-b border-gray-800 py-3">
                <div class="flex"><span class="text-gray-500 uppercase font-bold w-28">DIRECTOR</span><span id="detailDirector" class="text-gray-200 font-semibold">N/A</span></div>
                <div class="flex"><span class="text-gray-500 uppercase font-bold w-28">WRITTEN BY</span><span id="detailWriter" class="text-gray-200 font-semibold">N/A</span></div>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold uppercase text-gray-400 tracking-wider">TOP CAST</h3>
                <div id="detailCastContainer" class="flex items-center space-x-4 overflow-x-auto hide-scrollbar py-1"></div>
            </div>
        </div>
    </div>

    <!-- Filter Modal -->
    <div id="filterModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#12141c] border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                <div class="flex items-center space-x-2 text-cyan-400 font-bold text-lg">
                    <i class="fa-solid fa-filter"></i>
                    <span>FILTER CATALOG</span>
                </div>
                <button onclick="closeFilterModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex flex-col space-y-4 text-xs">
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Network / Studio</label>
                    <select id="filterNetworkSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Genre</label>
                    <select id="filterGenreSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
                <div>
                    <label class="text-cyan-400 font-semibold block mb-1">Year</label>
                    <select id="filterYearSelect" class="w-full bg-[#1a1d29] border border-gray-800 text-white rounded-xl px-4 py-3 outline-none"></select>
                </div>
            </div>

            <button onclick="applyFiltersFromModal()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg uppercase tracking-wide text-xs">
                Apply Filters
            </button>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
        <div class="bg-[#0e131d] px-4 py-2 flex items-center justify-between border-b border-gray-800">
            <span id="playerTitle" class="text-xs font-bold text-white">Playing Media</span>
            <button onclick="document.getElementById('playerModal').classList.add('hidden'); document.getElementById('videoIframe').src='';" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex-1 w-full h-full bg-black">
            <iframe id="videoIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- JavaScript Application Code -->
    <script>
        const API_KEY = 'cd193c4897ae4e519cca3734ef116a7e';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';
        const PLACEHOLDER_IMG = 'https://placehold.co/400x600/111622/ffffff?text=No+Image';

        const NETWORKS = [
            { id: 'all', name: 'All', companyId: null, networkId: null },
            { id: 42005, name: 'Marvel Studios', companyId: 42005, networkId: null, svg: `<span class="text-red-600 font-black text-xs uppercase">MARVEL</span>` },
            { id: 213, name: 'Netflix', companyId: null, networkId: 213, svg: `<span class="text-red-600 font-bold text-base uppercase">NETFLIX</span>` },
            { id: 2739, name: 'Disney+', companyId: null, networkId: 2739, svg: `<span class="text-cyan-500 font-bold italic text-sm">Disney+</span>` },
            { id: 119, name: 'Prime Video', companyId: 10211, networkId: 10211, svg: `<span class="text-black font-semibold text-xs flex items-center space-x-1"><span>prime</span><span class="text-cyan-500 font-bold">video</span></span>` },
            { id: 67, name: 'HBO Max', companyId: null, networkId: 49, svg: `<span class="text-purple-600 font-bold text-xs uppercase">HBOMAX</span>` },
            { id: 49, name: 'Hulu', companyId: null, networkId: 453, svg: `<span class="text-emerald-500 font-bold text-sm">hulu</span>` }
        ];

        const GENRES = [
            { id: 'all', name: 'All Genres' },
            { id: 28, name: 'Action' }, { id: 12, name: 'Adventure' }, { id: 16, name: 'Animation' },
            { id: 35, name: 'Comedy' }, { id: 80, name: 'Crime' }, { id: 18, name: 'Drama' },
            { id: 27, name: 'Horror' }, { id: 9648, name: 'Mystery' }, { id: 878, name: 'Science Fiction' }, { id: 53, name: 'Thriller' }
        ];

        let currentState = { type: 'movie', category: 'trending', networkId: 'all', genre: 'all', year: 'all', query: '', page: 1 };
        let cachedItems = [];
        let favorites = JSON.parse(localStorage.getItem('fv_favorites') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            setupFilters();
            setupEvents();
            fetchContent(true);
        });

        function setupFilters() {
            document.getElementById('networkChipsContainer').innerHTML = NETWORKS.filter(n => n.id !== 'all').map(n => `
                <button onclick="selectNetwork('${n.id}')" class="h-10 px-4 rounded-xl bg-white border border-gray-200 hover:border-cyan-500 transition shrink-0 flex items-center justify-center shadow-md">
                    ${n.svg}
                </button>
            `).join('');

            document.getElementById('filterNetworkSelect').innerHTML = NETWORKS.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
            document.getElementById('filterGenreSelect').innerHTML = GENRES.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            
            let yrs = '<option value="all">All Years</option>';
            for (let y = 2026; y >= 1970; y--) yrs += `<option value="${y}">${y}</option>`;
            document.getElementById('filterYearSelect').innerHTML = yrs;
        }

        function setupEvents() {
            document.getElementById('openSidebarBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.remove('hidden');
            });
            document.getElementById('sidebarOverlay').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            });
            document.getElementById('searchToggleBtn').addEventListener('click', () => {
                document.getElementById('searchBarContainer').classList.toggle('hidden');
            });
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentState.query = e.target.value.trim();
                currentState.page = 1;
                fetchContent(true);
            });
            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                currentState.query = '';
                fetchContent(true);
            });
        }

        function selectNetwork(id) {
            currentState.networkId = id;
            currentState.page = 1;
            fetchContent(true);
        }

        function switchCategory(cat) {
            currentState.category = cat;
            currentState.page = 1;
            ['trending', 'theater', 'popular'].forEach(c => {
                const btn = document.getElementById(`tab${c.charAt(0).toUpperCase() + c.slice(1)}`);
                if (btn) btn.className = c === cat ? 'py-3 text-white border-b-2 border-cyan-400 transition whitespace-nowrap' : 'py-3 text-gray-400 hover:text-white border-b-2 border-transparent transition whitespace-nowrap';
            });
            document.getElementById('pageTitle').innerText = `${currentState.type.toUpperCase()}S: ${cat.toUpperCase()}`;
            fetchContent(true);
        }

        function switchContentType(type) {
            currentState.type = type;
            currentState.page = 1;
            document.getElementById('pageTitle').innerText = `${type.toUpperCase()}S: ${currentState.category.toUpperCase()}`;
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
            fetchContent(true);
        }

        function openFilterModal() { document.getElementById('filterModal').classList.remove('hidden'); }
        function closeFilterModal() { document.getElementById('filterModal').classList.add('hidden'); }
        function applyFiltersFromModal() {
            currentState.networkId = document.getElementById('filterNetworkSelect').value;
            currentState.genre = document.getElementById('filterGenreSelect').value;
            currentState.year = document.getElementById('filterYearSelect').value;
            closeFilterModal();
            fetchContent(true);
        }

        function resetMainView() {
            currentState.networkId = 'all';
            currentState.genre = 'all';
            currentState.year = 'all';
            currentState.query = '';
            document.getElementById('customViewHeader').classList.add('hidden');
            fetchContent(true);
        }

        function showFavoritesView() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.add('hidden');
            document.getElementById('customViewHeader').classList.remove('hidden');
            document.getElementById('customViewTitle').innerText = 'FAVORITES';
            renderGrid(favorites);
        }

        async function fetchContent(reset = false) {
            const grid = document.getElementById('movieGrid');
            if (reset) grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 text-xs">Loading contents...</div>`;

            let url = `${BASE_URL}/trending/${currentState.type}/day?api_key=${API_KEY}&page=${currentState.page}`;
            if (currentState.category === 'theater') {
                url = currentState.type === 'movie' ? `${BASE_URL}/movie/now_playing?api_key=${API_KEY}&page=${currentState.page}` : `${BASE_URL}/tv/on_the_air?api_key=${API_KEY}&page=${currentState.page}`;
            } else if (currentState.category === 'popular') {
                url = `${BASE_URL}/${currentState.type}/popular?api_key=${API_KEY}&page=${currentState.page}`;
            }

            if (currentState.query) {
                url = `${BASE_URL}/search/${currentState.type}?api_key=${API_KEY}&query=${encodeURIComponent(currentState.query)}&page=${currentState.page}`;
            } else if (currentState.networkId !== 'all' || currentState.genre !== 'all' || currentState.year !== 'all') {
                url = `${BASE_URL}/discover/${currentState.type}?api_key=${API_KEY}&page=${currentState.page}`;
                if (currentState.networkId !== 'all') {
                    const netObj = NETWORKS.find(n => n.id == currentState.networkId);
                    if (netObj) {
                        if (currentState.type === 'tv' && netObj.networkId) url += `&with_networks=${netObj.networkId}`;
                        else if (netObj.companyId) url += `&with_companies=${netObj.companyId}`;
                    }
                }
                if (currentState.genre !== 'all') url += `&with_genres=${currentState.genre}`;
                if (currentState.year !== 'all') {
                    url += currentState.type === 'tv' ? `&first_air_date_year=${currentState.year}` : `&primary_release_year=${currentState.year}`;
                }
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                cachedItems = reset ? (data.results || []) : [...cachedItems, ...(data.results || [])];
                renderGrid(cachedItems);
            } catch (e) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500 text-xs">Failed to connect to stream server.</div>`;
            }
        }

        function handleLoadMore() {
            currentState.page++;
            fetchContent(false);
        }

        function renderGrid(items) {
            const grid = document.getElementById('movieGrid');
            if (!items || items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500 text-xs">No movies or series found.</div>`;
                return;
            }
            grid.innerHTML = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const year = (item.release_date || item.first_air_date || '2026').split('-')[0];
                const poster = item.poster_path ? `${IMAGE_URL}${item.poster_path}` : PLACEHOLDER_IMG;
                const itemType = item.media_type || currentState.type;

                return `
                    <div onclick="openMovieDetails(${item.id}, '${itemType}')" class="poster-card bg-[#111622] border border-gray-800/80 rounded-xl overflow-hidden flex flex-col cursor-pointer">
                        <div class="aspect-[2/3] w-full bg-gray-900 relative">
                            <img src="${poster}" class="w-full h-full object-cover" loading="lazy">
                        </div>
                        <div class="p-2 flex flex-col justify-between flex-1">
                            <h3 class="text-xs font-bold text-gray-100 truncate leading-tight">${title}</h3>
                            <span class="text-[10px] text-gray-400 mt-1">${year}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openMovieDetails(id, type) {
            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&append_to_response=credits`);
                const data = await res.json();

                document.getElementById('detailBackdrop').src = data.backdrop_path ? BACKDROP_URL + data.backdrop_path : PLACEHOLDER_IMG;
                document.getElementById('detailTitle').innerText = data.title || data.name;
                document.getElementById('detailYear').innerText = (data.release_date || data.first_air_date || '2026').split('-')[0];
                document.getElementById('detailGenres').innerText = (data.genres || []).map(g => g.name).join(', ');
                document.getElementById('detailOverview').innerText = data.overview || 'No description available.';

                const director = (data.credits?.crew || []).find(c => c.job === 'Director');
                document.getElementById('detailDirector').innerText = director ? director.name : 'N/A';
                
                const writer = (data.credits?.crew || []).find(c => c.job === 'Screenplay' || c.job === 'Writer');
                document.getElementById('detailWriter').innerText = writer ? writer.name : 'N/A';

                const castContainer = document.getElementById('detailCastContainer');
                castContainer.innerHTML = (data.credits?.cast || []).slice(0, 15).map(actor => `
                    <div class="flex flex-col items-center shrink-0 w-20 text-center">
                        <img src="${actor.profile_path ? IMAGE_URL + actor.profile_path : PLACEHOLDER_IMG}" class="w-14 h-14 rounded-full object-cover border border-gray-700 shadow">
                        <span class="text-[10px] font-bold text-white mt-1 truncate w-full">${actor.name}</span>
                        <span class="text-[9px] text-gray-400 truncate w-full">${actor.character || ''}</span>
                    </div>
                `).join('');

                const isFav = favorites.some(f => f.id === data.id);
                const favBtn = document.getElementById('detailFavoriteBtn');
                favBtn.innerHTML = `<i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>`;
                favBtn.onclick = () => toggleFavorite(data);

                document.getElementById('detailPlayBtn').onclick = () => {
                    document.getElementById('playerTitle').innerText = data.title || data.name;
                    document.getElementById('videoIframe').src = type === 'tv' ? `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1` : `https://vidsrc.me/embed/movie?tmdb=${id}`;
                    document.getElementById('playerModal').classList.remove('hidden');
                };

                document.getElementById('movieDetailModal').classList.remove('hidden');
            } catch (e) {}
        }

        function toggleFavorite(item) {
            const idx = favorites.findIndex(f => f.id === item.id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(item);
            localStorage.setItem('fv_favorites', JSON.stringify(favorites));
            openMovieDetails(item.id, item.title ? 'movie' : 'tv');
        }
    </script>
</body>
</html>
